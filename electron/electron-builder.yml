appId: com.karol.app
productName: Karol
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/node_modules/**'
  - '!**/src/*'
  - '!{.env,.env.*,.npmrc,.gitignore,README.md}'
  - '!{.git,package-lock.json}'
extraResources:
  - from: ../api-server
    to: api-server
  - from: ../dj-controller/dist
    to: dj-controller
  - from: ../library-dashboard
    to: library-dashboard
  - from: ../ableton-mixer
    to: ableton-mixer
  - from: ../scripts
    to: scripts
  - from: ../tools
    to: tools
mac:
  artifactName: ${name}-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSScreenCaptureUsageDescription: Karol needs audio capture permission for karaoke playback.
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
