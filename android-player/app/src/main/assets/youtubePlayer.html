<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
// YouTube IFrame API bootstrap
var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

var player;
var currentVideoId = '';
var playerReady = false;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    playerVars: {
      autoplay: 1,
      controls: 0,
      rel: 0,
      fs: 0,
      modestbranding: 1,
      playsinline: 1,
      iv_load_policy: 3,
      cc_load_policy: 0,
    },
    events: {
      onReady: function() {
        playerReady = true;
        window.DeskreenPlayer.onPlayerReady();
      },
      onStateChange: function(evt) {
        window.DeskreenPlayer.onStateChange(evt.data);
      },
      onError: function(evt) {
        window.DeskreenPlayer.onError(evt.data);
      }
    }
  });
}

function loadVideo(videoId) {
  currentVideoId = videoId;
  if (player && player.loadVideoById) {
    player.loadVideoById({videoId: videoId, startSeconds: 0});
  }
}

function cueVideo(videoId) {
  currentVideoId = videoId;
  if (player && player.cueVideoById) {
    player.cueVideoById({videoId: videoId, startSeconds: 0});
  }
}

function playVideo() {
  if (player && player.playVideo) player.playVideo();
}

function pauseVideo() {
  if (player && player.pauseVideo) player.pauseVideo();
}

function seekTo(seconds) {
  if (player && player.seekTo) player.seekTo(seconds, true);
}

function setVolume(level) {
  if (player && player.setVolume) player.setVolume(Math.round(level * 100));
}

function getCurrentTime() {
  return player && player.getCurrentTime ? player.getCurrentTime() : 0;
}

function getDuration() {
  return player && player.getDuration ? player.getDuration() : 0;
}

function getPlayerState() {
  return player && player.getPlayerState ? player.getPlayerState() : -1;
}

function getVideoUrl() {
  return player && player.getVideoUrl ? player.getVideoUrl() : '';
}
</script>
</body>
</html>
