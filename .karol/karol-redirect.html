<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Refresh" content="0; url=https://request.rideyrbike.com/library/" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Karol Library</title>
<style>
:root{--bg:#08080c;--bg2:#101016;--text:#ddd;--accent:#8b5cf6}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:24px}
h1{font-size:1.2rem;margin-bottom:8px}
p{color:#777;font-size:0.85rem;margin-bottom:16px}
a{color:var(--accent);font-size:0.9rem}
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>Karol Library</h1>
  <p>Redirecting...</p>
  <a href="https://request.rideyrbike.com/library/">Go to library</a>
</div>
</body>
</html>
