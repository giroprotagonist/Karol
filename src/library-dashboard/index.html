<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Karol Library</title>
<style>
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--text:#e4e4ec;--text2:#8888a0;--accent:#8b5cf6;--green:#10b981;--amber:#f59e0b;--red:#f87171;--border:#222233;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:1.2rem;font-weight:700}
.stats-row{display:flex;gap:16px;font-size:0.82rem;color:var(--text2);flex-wrap:wrap}
.stats-row .val{color:var(--accent);font-weight:600}

/* ── Player Bar ── */
.player-bar{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px;min-height:68px}
.player-bar.disconnected{opacity:.4}
.player-art{width:48px;height:48px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--bg3)}
.player-art img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0}
.player-title{font-size:0.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.player-subtitle{font-size:0.75rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.player-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}
.player-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all .15s}
.player-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.player-btn:active{transform:scale(0.95)}
.player-btn.play-pause{width:44px;height:44px;font-size:1.2rem}
.player-btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}
.player-progress-container{width:100%;display:flex;align-items:center;gap:10px;padding:0 24px 8px;margin-top:-4px}
.player-progress{flex:1;height:4px;background:var(--bg3);border-radius:2px;cursor:pointer;position:relative}
.player-progress-fill{height:100%;background:var(--accent);border-radius:2px;position:relative;transition:width .3s linear}
.player-progress-fill::after{content:'';position:absolute;right:-6px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .15s}
.player-progress:hover .player-progress-fill::after{opacity:1}
.player-time{font-size:0.72rem;color:var(--text2);font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
.player-volume{display:flex;align-items:center;gap:6px}
.player-volume input[type=range]{width:60px;height:4px;-webkit-appearance:none;appearance:none;background:var(--bg3);border-radius:2px;outline:none;cursor:pointer}
.player-volume input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
.player-sync-status{font-size:0.7rem;color:var(--text2);display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:4px}
.player-sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.player-sync-dot.synced{background:var(--green)}
.player-sync-dot.desynced{background:var(--amber)}
.player-sync-dot.disconnected{background:var(--red)}

.player-actions{display:flex;gap:4px;flex-shrink:0}
.player-actions .player-btn{width:28px;height:28px;font-size:0.7rem}

nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 24px}
nav.tabs button{padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-size:0.85rem;cursor:pointer;font-weight:500;transition:all .15s}
nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--text)}
main{padding:20px 24px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:200px;max-width:400px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:0.9rem;outline:none}
.toolbar input:focus{border-color:var(--accent)}
.toolbar select{padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:0.9rem;cursor:pointer}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s;position:relative;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card.not-downloaded{opacity:.55}
.card.not-downloaded:hover{opacity:.85}
.card-img{width:100%;aspect-ratio:16/9;background:var(--bg3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-placeholder{color:var(--text2);font-size:2rem}
.card-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
.card:hover .card-overlay{opacity:1}
.card-overlay-btn{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:transform .15s}
.card-overlay-btn:hover{transform:scale(1.1)}
.card-overlay-btn.queue-btn{background:rgba(255,255,255,.2);width:36px;height:36px;font-size:0.9rem;margin-left:8px}
.card-badge-row{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;z-index:1}
.card-body{padding:12px}
.card-title{font-size:0.9rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:0.75rem;color:var(--text2)}
.badge{padding:2px 8px;border-radius:12px;font-weight:600;font-size:0.7rem;white-space:nowrap}
.badge-sub{background:rgba(139,92,246,.15);color:var(--accent)}
.badge-no-sub{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-downloaded{background:rgba(16,185,129,.15);color:var(--green)}
.badge-missing{background:rgba(239,68,68,.12);color:var(--red)}
.badge-playlist{background:rgba(59,130,246,.12);color:#60a5fa;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.badge-now-playing{background:rgba(139,92,246,.25);color:var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty p{margin-top:8px;font-size:0.9rem}
.loading{text-align:center;padding:40px;color:var(--text2)}
.playlist-table{width:100%;border-collapse:collapse}
.playlist-table th,.playlist-table td{padding:12px 16px;text-align:left;font-size:0.85rem;border-bottom:1px solid var(--border)}
.playlist-table th{color:var(--text2);font-weight:600;font-size:0.78rem;text-transform:uppercase;letter-spacing:.04em}
.playlist-table tr:hover{background:var(--bg3)}
.playlist-table td.name{font-weight:600}
.playlist-table td.actions button{padding:4px 12px;border-radius:12px;border:1px solid var(--accent);background:rgba(139,92,246,.08);color:var(--accent);font-size:0.75rem;cursor:pointer}
.playlist-table td.actions button:hover{background:rgba(139,92,246,.2)}
.progress-bar{width:120px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.progress-bar-fill.done{background:var(--green)}
.hidden{display:none!important}
.summary-banner{padding:12px 16px;border-radius:var(--radius);background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;font-size:0.82rem;color:var(--text2)}
.summary-banner strong{color:var(--accent)}

/* ── Karaoke badge & tag toggle ── */
.badge-karaoke{background:rgba(168,85,247,.15);color:#a855f7}
.card.karaoke{border-left:3px solid #a855f7}
.card-tag-toggle{position:absolute;bottom:8px;right:8px;z-index:2;padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.65);color:var(--text2);font-size:0.68rem;cursor:pointer;font-weight:600;opacity:0;transition:all .2s;pointer-events:none}
.card:hover .card-tag-toggle{opacity:1;pointer-events:auto}
.card-tag-toggle:hover{background:rgba(168,85,247,.25);border-color:#a855f7;color:#a855f7}
.card-tag-toggle.is-karaoke{color:#a855f7;border-color:#a855f7;background:rgba(168,85,247,.15)}
.card-tag-toggle::before{content:'🎤'}
.card-tag-toggle.is-karaoke::before{content:'🎤 Karaoke'}
.card-tag-toggle:not(.is-karaoke)::before{content:'🎵 Music'}

/* ── Queue mode ── */
.queue-now-playing{background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(139,92,246,.02));border:1px solid rgba(139,92,246,.2);border-radius:var(--radius);padding:20px;margin-bottom:20px;display:flex;gap:16px;align-items:center}
.queue-now-playing .thumb{width:160px;height:90px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--bg3)}
.queue-now-playing .thumb img{width:100%;height:100%;object-fit:cover}
.queue-now-playing .info{flex:1;min-width:0}
.queue-now-playing .label{font-size:0.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:6px}
.queue-now-playing .title{font-size:1.05rem;font-weight:700;line-height:1.3}
.queue-now-playing .meta{font-size:0.78rem;color:var(--text2);margin-top:4px}
.queue-now-playing .actions{display:flex;gap:8px;margin-top:10px}
.queue-now-playing .actions button{padding:6px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:0.78rem;cursor:pointer;transition:all .15s}
.queue-now-playing .actions button:hover{border-color:var(--accent);background:rgba(139,92,246,.1)}

.queue-list{display:flex;flex-direction:column;gap:2px}
.queue-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--radius);transition:background .15s;position:relative}
.queue-item:hover{background:var(--bg3)}
.queue-item .pos{width:28px;text-align:center;font-size:0.82rem;font-weight:700;color:var(--text2);flex-shrink:0}
.queue-item .pos.current{color:var(--accent)}
.queue-item .thumb{width:64px;height:36px;border-radius:4px;overflow:hidden;flex-shrink:0;background:var(--bg2)}
.queue-item .thumb img{width:100%;height:100%;object-fit:cover}
.queue-item .info{flex:1;min-width:0}
.queue-item .title{font-size:0.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-item .meta{font-size:0.72rem;color:var(--text2)}
.queue-item .actions{display:flex;gap:6px;flex-shrink:0;opacity:0;transition:opacity .15s}
.queue-item:hover .actions{opacity:1}
.queue-item .actions button{padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:0.7rem;cursor:pointer;transition:all .15s}
.queue-item .actions button:hover{border-color:var(--accent);color:var(--accent)}
.queue-item .actions button.danger:hover{border-color:var(--red);color:var(--red)}
.queue-empty{text-align:center;padding:40px;color:var(--text2);font-size:0.9rem}

/* Toast notification */
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:var(--radius);font-size:0.85rem;z-index:100;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<header>
<h1>Karol Library</h1>
<div class="stats-row" id="stats">
<span>Tracked: <span class="val" id="statTracked">-</span></span>
<span>Downloaded: <span class="val" id="statDl">-</span></span>
<span>Size: <span class="val" id="statSize">-</span></span>
<span>Playlists: <span class="val" id="statPl">-</span></span>
</div>
</header>

<!-- ── Player Bar ── -->
<div class="player-bar" id="playerBar">
  <div class="player-art">
    <img id="playerArt" src="" alt="">
  </div>
  <div class="player-info">
    <div class="player-title" id="playerTitle">No track playing</div>
    <div class="player-subtitle" id="playerSubtitle">Select a video to play on S8</div>
  </div>
  <div class="player-controls">
    <button class="player-btn" id="btnPrev" title="Previous" onclick="playerPrev()">&#x23EE;</button>
    <button class="player-btn play-pause" id="btnPlayPause" title="Play/Pause" onclick="playerToggle()">&#x25B6;</button>
    <button class="player-btn" id="btnNext" title="Next" onclick="playerNext()">&#x23ED;</button>
  </div>
  <div class="player-volume">
    <span style="font-size:0.8rem;color:var(--text2)">&#x1F50A;</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="100" oninput="setVolume(this.value)" title="Volume">
  </div>
  <div class="player-sync-status" id="syncStatus" title="S8 player connection">
    <span class="player-sync-dot disconnected"></span>
    <span id="syncLabel">S8</span>
  </div>
</div>
<div class="player-progress-container">
  <span class="player-time" id="timeCurrent">0:00</span>
  <div class="player-progress" id="seekBar" onclick="seekClick(event)" title="Seek">
    <div class="player-progress-fill" id="seekFill" style="width:0%"></div>
  </div>
  <span class="player-time" id="timeDuration">0:00</span>
</div>

<nav class="tabs">
<button id="tabVideos" class="active" onclick="switchTab('videos')">All Videos</button>
<button id="tabPlaylists" onclick="switchTab('playlists')">Playlists</button>
<button id="tabQueue" onclick="switchTab('queue')">Queue</button>
</nav>
<main>
<!-- ALL VIDEOS TAB (merged: downloaded + tracked-from-playlists) -->
<div id="panelVideos">
<div class="summary-banner" id="summary"></div>
<div class="toolbar">
<input type="text" id="searchInput" placeholder="Search by title..." oninput="renderVideos()">
<select id="playlistFilter" onchange="renderVideos()">
<option value="">All playlists</option>
</select>
<select id="downloadFilter" onchange="renderVideos()">
<option value="">All status</option>
<option value="downloaded">Downloaded</option>
<option value="missing">Not downloaded</option>
</select>
<select id="subFilter" onchange="renderVideos()">
<option value="">All videos</option>
<option value="has-subs">Has subtitles</option>
<option value="no-subs">No subtitles</option>
</select>
  <select id="sortSelect" onchange="renderVideos()">
    <option value="downloaded-first">Downloaded first</option>
    <option value="title">Title A-Z</option>
    <option value="duration">Duration</option>
  </select>
  <select id="tagFilter" onchange="renderVideos()">
    <option value="">All types</option>
    <option value="karaoke">Karaoke</option>
    <option value="music">Music Videos</option>
  </select>
</div>
<div class="video-grid" id="grid"><div class="loading">Loading library...</div></div>
</div>

<!-- PLAYLISTS TAB -->
<div id="panelPlaylists" class="hidden">
<div class="toolbar">
<button id="syncAllBtn" onclick="syncAllPlaylists()" style="padding:8px 16px;border-radius:var(--radius);border:1px solid var(--accent);background:rgba(139,92,246,.08);color:var(--accent);font-size:0.85rem;cursor:pointer;font-weight:600">Sync All Now</button>
<span style="font-size:0.82rem;color:var(--text2);margin-left:8px">Auto-refreshes every 30s</span>
</div>
<table class="playlist-table">
<thead><tr><th>Playlist</th><th>Tracks</th><th>Downloaded</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="playlistBody"><tr><td colspan="5" class="loading">Loading playlists...</td></tr></tbody>
</table>
</div>

<!-- QUEUE TAB -->
<div id="panelQueue" class="hidden">
<div class="queue-now-playing" id="queueNowPlaying">
  <div class="thumb"><img id="queueNpThumb" src="" alt=""></div>
  <div class="info">
    <div class="label">Now Playing</div>
    <div class="title" id="queueNpTitle">-</div>
    <div class="meta" id="queueNpMeta">-</div>
    <div class="actions">
      <button onclick="playerToggle()">Play / Pause</button>
      <button onclick="playerNext()">Skip</button>
    </div>
  </div>
</div>
<h3 style="margin-bottom:12px;font-size:0.9rem;color:var(--text2)">Upcoming</h3>
<div class="queue-list" id="queueList">
  <div class="loading">Loading queue...</div>
</div>
</div>
</main>
<div class="toast" id="toast"></div>

<script>
var allVideos=[];    // merged: all tracked videoIds with download status
var stats={};
var playlists=[];
var activePlaylistId='';
var localMap={};     // videoId -> metadata for downloaded videos
var tags={};        // videoId -> 'karaoke' | 'music'
var API=window.location.origin+'/api/library';
var YTAPI=window.location.origin+'/api/youtube-dj';

// ── Player state ──
var nowPlaying=null;
var playerConnected=false;
var playerDragging=false;

// ── Toast ──
var toastTimer=null;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show')},2500);
}

// ── Player API calls ──
function playerAction(endpoint,body){
  var opts={method:'POST',headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  return fetch(YTAPI+endpoint,opts).catch(function(){playerConnected=false;updatePlayerUI()});
}

function playerToggle(){
  if(!nowPlaying){return}
  if(nowPlaying.state===1) playerAction('/transport/pause');
  else playerAction('/transport/play');
  // Optimistic update
  if(nowPlaying.state===1){nowPlaying.state=2;updatePlayPauseBtn()}
  else{nowPlaying.state=1;updatePlayPauseBtn()}
}

function playerNext(){playerAction('/transport/skip-next',{}).then(function(){setTimeout(pollNowPlaying,500)})}
function playerPrev(){playerAction('/transport/skip-prev',{}).then(function(){setTimeout(pollNowPlaying,500)})}

function setVolume(v){
  playerAction('/transport/volume',{level:parseInt(v)/100});
}

function seekClick(e){
  if(!nowPlaying||!nowPlaying.duration) return;
  var bar=document.getElementById('seekBar');
  var rect=bar.getBoundingClientRect();
  var pct=(e.clientX-rect.left)/rect.width;
  var pos=Math.max(0,Math.min(nowPlaying.duration,Math.round(pct*nowPlaying.duration)));
  playerAction('/transport/seek',{seconds:pos});
  // Optimistic update
  nowPlaying.currentTime=pos;
  updateSeekBar();
}

function playVideoNow(videoId){
  showToast('Sending to S8...');
  var url='https://www.youtube.com/watch?v='+videoId;
  playerAction('/play-now',{url:url}).then(function(r){
    if(r&&r.ok) showToast('Playing on S8');
    else showToast('Failed to play');
    setTimeout(pollNowPlaying,800);
  }).catch(function(){showToast('Player unreachable')});
}

function addToQueue(videoId){
  showToast('Added to queue');
  var url='https://www.youtube.com/watch?v='+videoId;
  fetch(window.location.origin+'/api/youtube-karaoke/queue',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:url})
  }).catch(function(){showToast('Player unreachable')});
}

// ── Player UI ──
function updatePlayerUI(){
  var np=nowPlaying;
  var art=document.getElementById('playerArt');
  var titleEl=document.getElementById('playerTitle');
  var subEl=document.getElementById('playerSubtitle');
  var bar=document.getElementById('playerBar');
  var syncDot=document.querySelector('.player-sync-dot');
  var syncLabel=document.getElementById('syncLabel');

  if(!playerConnected){
    bar.classList.add('disconnected');
    syncDot.className='player-sync-dot disconnected';
    syncLabel.textContent='S8 offline';
    if(!np){
      titleEl.textContent='No track playing';
      subEl.textContent='Player disconnected';
      art.src='';
    }
    updatePlayPauseBtn();
    return;
  }

  bar.classList.remove('disconnected');

  if(!np){
    titleEl.textContent='No track playing';
    subEl.textContent='Connected to S8';
    art.src='';
    syncDot.className='player-sync-dot synced';
    syncLabel.textContent='S8 ready';
    document.getElementById('timeCurrent').textContent='0:00';
    document.getElementById('timeDuration').textContent='0:00';
    document.getElementById('seekFill').style.width='0%';
    updatePlayPauseBtn();
    return;
  }

  titleEl.textContent=np.title||'Unknown';
  // Try to extract artist: "Artist - Title" or "Title - Artist"
  var parts=(np.title||'').split(' - ');
  if(parts.length>=2){
    subEl.textContent=parts[0].trim();
  } else {
    subEl.textContent=np.videoId||'';
  }
  if(np.thumbnail){
    art.src=np.thumbnail;
  } else if(np.videoId){
    art.src='https://i.ytimg.com/vi/'+np.videoId+'/default.jpg';
  }

  syncDot.className='player-sync-dot synced';
  syncLabel.textContent='S8 synced';

  updatePlayPauseBtn();
  updateSeekBar();
}

function updatePlayPauseBtn(){
  var btn=document.getElementById('btnPlayPause');
  var isPlaying=nowPlaying&&nowPlaying.state===1;
  btn.innerHTML=isPlaying?'&#x23F8;':'&#x25B6;';
  btn.disabled=!playerConnected||!nowPlaying;
  document.getElementById('btnPrev').disabled=!playerConnected||!nowPlaying;
  document.getElementById('btnNext').disabled=!playerConnected||!nowPlaying;
}

function updateSeekBar(){
  var np=nowPlaying;
  var pct=np&&np.duration?Math.min(100,(np.currentTime/np.duration)*100):0;
  document.getElementById('seekFill').style.width=pct+'%';
  document.getElementById('timeCurrent').textContent=np?fmtDur(np.currentTime):'0:00';
  document.getElementById('timeDuration').textContent=np&&np.duration?fmtDur(np.duration):'0:00';
}

// ── Poll now-playing every 5s ──
function pollNowPlaying(){
  fetch(YTAPI+'/now-playing').then(function(r){
    if(!r.ok) throw new Error('status '+r.status);
    return r.json();
  }).then(function(d){
    playerConnected=true;
    nowPlaying=d;
    updatePlayerUI();
    // Also update queue highlights
    updatePlayingHighlights(d.videoId);
  }).catch(function(){
    playerConnected=false;
    nowPlaying=null;
    updatePlayerUI();
  });
}

function updatePlayingHighlights(currentVideoId){
  // Mark the currently playing card
  var cards=document.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(currentVideoId&&c.dataset.videoId===currentVideoId){
      c.style.borderColor='var(--accent)';
    } else {
      c.style.borderColor='';
    }
  }
}

// ── Clock-based seek bar progression between polls ──
var lastPollTime=0;
var clockInterval=null;
function startClockTick(){
  if(clockInterval) clearInterval(clockInterval);
  clockInterval=setInterval(function(){
    if(!nowPlaying||nowPlaying.state!==1||playerDragging) return;
    var elapsed=(Date.now()-lastPollTime)/1000;
    if(elapsed>0&&elapsed<10){
      nowPlaying.currentTime=Math.min(nowPlaying.duration,(nowPlaying.currentTime||0)+elapsed);
      updateSeekBar();
    }
  },500);
}

// ── loadAll (existing, modified to also poll player) ──
function loadAll(){
  Promise.all([
    fetch(API+'/list').then(function(r){return r.json()}),
    fetch(API+'/scan').then(function(r){return r.json()}),
    fetch(YTAPI+'/playlist').then(function(r){return r.json()}).catch(function(){return {config:{playlists:[]}}}),
    fetch(YTAPI+'/queue').then(function(r){return r.json()}).catch(function(){return {queue:[]}}),
    fetch(API+'/tags').then(function(r){return r.json()}).catch(function(){return {tags:{}}})
  ]).then(function(d){
    var localList=d[0].videos||[]; stats=d[1];
    var cfg=(d[2].config)||{}; playlists=cfg.playlists||[]; activePlaylistId=cfg.activePlaylistId||'';
    var queueItems=(d[3].queue||d[3])||[];
    var tagsResp=d[4]; tags=tagsResp.tags||{};

    // Build queueMap: videoId -> {title, thumbnail} from S8 queue
    var queueMap={};
    if(Array.isArray(queueItems)){
      for(var i=0;i<queueItems.length;i++){
        var qi=queueItems[i];
        if(qi.videoId) queueMap[qi.videoId]={title:qi.title||qi.videoId,thumb:qi.thumbnail||''};
      }
    }

    // Build localMap: videoId -> metadata
    localMap={};
    for(var i=0;i<localList.length;i++){
      var v=localList[i];
      localMap[v.videoId]=v;
    }

    // Build merged allVideos: every videoId tracked by any playlist
    var seen={};
    var merged=[];
    for(var i=0;i<playlists.length;i++){
      var pl=playlists[i];
      var ids=pl.syncedVideoIds||[];
      for(var j=0;j<ids.length;j++){
        var vid=ids[j];
        if(seen[vid]){
          var existing=merged[seen[vid]-1];
          if(existing){
            existing.playlists=existing.playlists||[];
            existing.playlists.push({id:pl.playlistId,name:pl.name||pl.playlistId});
          }
          continue;
        }
        seen[vid]=merged.length+1;
        var local=localMap[vid];
        var qi=queueMap[vid];
        merged.push({
          videoId:vid,
          title:(local && local.title !== vid) ? local.title : (qi ? qi.title : vid),
          duration:local?local.duration:0,
          size:local?local.size:0,
          subtitles:local?local.subtitles:[],
          thumbnail:(local && local.thumbnail) ? local.thumbnail : (qi ? qi.thumb : ''),
          downloaded:!!local,
          tag:tags[vid]||'music',
          playlists:[{id:pl.playlistId,name:pl.name||pl.playlistId}]
        });
      }
    }
    allVideos=merged;

    // Update stats
    var dlCount=merged.filter(function(v){return v.downloaded}).length;
    document.getElementById('statTracked').textContent=merged.length;
    document.getElementById('statDl').textContent=dlCount;
    document.getElementById('statSize').textContent=stats.totalSizeFormatted||'0 MB';
    document.getElementById('statPl').textContent=playlists.length;

    // Populate playlist filter
    var pf=document.getElementById('playlistFilter');
    pf.innerHTML='<option value="">All playlists ('+merged.length+' videos)</option>';
    for(var i=0;i<playlists.length;i++){
      pf.innerHTML+='<option value="'+esc(playlists[i].playlistId)+'">'+esc(playlists[i].name||playlists[i].playlistId)+'</option>';
    }

    renderVideos();
    renderPlaylists();
  }).catch(function(){
    document.getElementById('grid').innerHTML='<div class="empty"><p>Could not load library. Is the server running?</p></div>';
    document.getElementById('playlistBody').innerHTML='<tr><td colspan="5" class="loading">Could not load playlists.</td></tr>';
  });
}

function switchTab(tab){
  document.getElementById('tabVideos').className=tab==='videos'?'active':'';
  document.getElementById('tabPlaylists').className=tab==='playlists'?'active':'';
  document.getElementById('tabQueue').className=tab==='queue'?'active':'';
  document.getElementById('panelVideos').className=tab==='videos'?'':'hidden';
  document.getElementById('panelPlaylists').className=tab==='playlists'?'':'hidden';
  document.getElementById('panelQueue').className=tab==='queue'?'':'hidden';
  if(tab==='queue') renderQueue();
}

function renderVideos(){
  var q=(document.getElementById('searchInput').value||'').toLowerCase();
  var plF=document.getElementById('playlistFilter').value;
  var dlF=document.getElementById('downloadFilter').value;
  var subF=document.getElementById('subFilter').value;
  var sort=document.getElementById('sortSelect').value;

  var filtered=allVideos.slice();
  if(q) filtered=filtered.filter(function(v){return v.title.toLowerCase().indexOf(q)!==-1});
  if(plF) filtered=filtered.filter(function(v){return (v.playlists||[]).some(function(p){return p.id===plF})});
  if(dlF==='downloaded') filtered=filtered.filter(function(v){return v.downloaded});
  if(dlF==='missing') filtered=filtered.filter(function(v){return !v.downloaded});
  if(subF==='has-subs') filtered=filtered.filter(function(v){return (v.subtitles||[]).length>0});
  if(subF==='no-subs') filtered=filtered.filter(function(v){return (v.subtitles||[]).length===0});
  var tagF=document.getElementById('tagFilter').value;
  if(tagF==='karaoke') filtered=filtered.filter(function(v){return v.tag==='karaoke'});
  if(tagF==='music') filtered=filtered.filter(function(v){return v.tag==='music'});
  if(sort==='title') filtered.sort(function(a,b){return a.title.localeCompare(b.title)});
  else if(sort==='duration') filtered.sort(function(a,b){return b.duration-a.duration});
  else filtered.sort(function(a,b){return (b.downloaded?1:0)-(a.downloaded?1:0)});

  var dlInView=filtered.filter(function(v){return v.downloaded}).length;
  document.getElementById('summary').innerHTML='Showing <strong>'+filtered.length+'</strong> videos (<strong>'+dlInView+'</strong> downloaded, <strong>'+(filtered.length-dlInView)+'</strong> pending)';

  var grid=document.getElementById('grid');
  if(filtered.length===0){grid.innerHTML='<div class="empty"><p>No videos match</p></div>';return}

  var currentVid=nowPlaying?nowPlaying.videoId:null;

  grid.innerHTML=filtered.map(function(v){
    var dur=fmtDur(v.duration), size=fmtSize(v.size), subs=v.subtitles||[];
    var subBadges='';
    if(v.downloaded){
      subBadges=subs.length?subs.map(function(l){return '<span class="badge badge-sub">'+esc(l)+'</span>'}).join(''):'<span class="badge badge-no-sub">no subs</span>';
    }
    var plBadges=(v.playlists||[]).map(function(p){
      var isActive=p.id===activePlaylistId;
      return '<span class="badge badge-playlist'+(isActive?' badge-active':'')+'">'+esc(p.name)+'</span>';
    }).join('');
    var dlBadge=v.downloaded?'<span class="badge badge-downloaded">downloaded</span>':'<span class="badge badge-missing">not downloaded</span>';
    var isNowPlaying=v.videoId===currentVid;
    var isKaraoke=v.tag==='karaoke';
    var nowPlayingBadge=isNowPlaying?'<span class="badge badge-now-playing">now playing</span>':'';
    var karaokeBadge=isKaraoke?'<span class="badge badge-karaoke">Karaoke</span>':'';
    var cardClass=v.downloaded?'card':'card not-downloaded';
    if(isNowPlaying) cardClass+=' now-playing';
    if(isKaraoke) cardClass+=' karaoke';
    var thumbSrc=v.thumbnail||'';
    if(!thumbSrc&&v.videoId){
      thumbSrc='https://i.ytimg.com/vi/'+v.videoId+'/hqdefault.jpg';
    }
    var imgHtml='';
    if(thumbSrc){
      imgHtml='<img src="'+esc(thumbSrc)+'" loading="lazy" onerror="this.parentElement.parentElement.querySelector(\'.card-overlay\').style.display=\'none\';this.parentElement.innerHTML=\'<span class=card-placeholder>'+(v.downloaded?'&#x1F3A5;':'&#x1F4E5;')+'</span>\'">';
    } else {
      imgHtml='<span class="card-placeholder">'+(v.downloaded?'&#x1F3A5;':'&#x1F4E5;')+'</span>';
    }
    var metaHtml;
    if(v.downloaded){
      if(v.duration || v.size > 0){
        metaHtml = '<span>'+dur+'</span><span>'+size+'</span>'+subBadges;
      } else {
        metaHtml = '<span>Downloaded</span>'+(subBadges||'');
      }
    } else {
      metaHtml = '<span>Not yet downloaded</span>';
    }
    var titleHtml=esc(v.title);
    return '<div class="'+cardClass+'" data-video-id="'+esc(v.videoId)+'" onclick="playVideoNow(\''+esc(v.videoId)+'\')">'+
      '<div class="card-badge-row">'+nowPlayingBadge+dlBadge+karaokeBadge+plBadges+'</div>'+
      '<div class="card-img">'+imgHtml+
        '<div class="card-overlay">'+
          '<button class="card-overlay-btn" onclick="event.stopPropagation();playVideoNow(\''+esc(v.videoId)+'\')" title="Play Now">&#x25B6;</button>'+
          '<button class="card-overlay-btn queue-btn" onclick="event.stopPropagation();addToQueue(\''+esc(v.videoId)+'\')" title="Add to Queue">+</button>'+
        '</div>'+
      '</div>'+
      '<button class="card-tag-toggle'+(isKaraoke?' is-karaoke':'')+'" onclick="event.stopPropagation();toggleTag(\''+esc(v.videoId)+'\',\''+(isKaraoke?'music':'karaoke')+'\')" title="Tag as '+(isKaraoke?'Music Video':'Karaoke')+'"></button>'+
      '<div class="card-body">'+
        '<div class="card-title">'+titleHtml+'</div>'+
        '<div class="card-meta">'+metaHtml+'</div>'+
      '</div></div>';
  }).join('');

  updatePlayingHighlights(currentVid);
}

function renderPlaylists(){
  var body=document.getElementById('playlistBody');
  if(playlists.length===0){body.innerHTML='<tr><td colspan="5" class="loading">No playlists saved yet. Add one from the Karol app.</td></tr>';return}
  var localIds=Object.keys(localMap);
  body.innerHTML=playlists.map(function(p){
    var isActive=p.playlistId===activePlaylistId;
    var count=p.videoCount||0;
    var syncedIds=p.syncedVideoIds||[];
    var dlCount=0;
    for(var i=0;i<syncedIds.length;i++){if(localMap[syncedIds[i]]) dlCount++;}
    var pct=count>0?Math.round(dlCount/count*100):0;
    var done=pct>=100;
    var barClass=done?'progress-bar-fill done':'progress-bar-fill';
    var dlBadge='';
    if(done&&count>0) dlBadge='<span class="badge badge-downloaded">done</span>';
    else if(dlCount>0) dlBadge='<span class="badge badge-downloaded">'+dlCount+'/'+count+'</span>';
    var actionBtn='';
    if(isActive) actionBtn='<span class="badge badge-active">Active</span>';
    else if(!done&&count>0) actionBtn='<button onclick="downloadPl(\''+p.playlistId+'\')">Download</button>';
    return '<tr><td class="name">'+esc(p.name||p.playlistId)+(isActive?' <span class="badge badge-active">Show</span>':'')+'</td><td>'+count+'</td><td>'+(count>0?'<span class="progress-bar"><span class="'+barClass+'" style="width:'+pct+'%"></span></span>'+dlCount+'/'+count:'-')+'</td><td>'+dlBadge+'</td><td class="actions">'+actionBtn+'</td></tr>';
  }).join('');
}

function downloadPl(pid){
  var pl=playlists.find(function(p){return p.playlistId===pid});
  if(!pl) return;
  fetch(window.location.origin+'/api/library/download-playlist',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({playlistUrl:pl.playlistUrl||'https://www.youtube.com/playlist?list='+pid})
  }).then(function(){loadAll()}).catch(function(){});
}

function syncAllPlaylists(){
  document.getElementById('syncAllBtn').textContent='Syncing...';
  document.getElementById('syncAllBtn').disabled=true;
  fetch(YTAPI+'/sync',{method:'POST'})
  .then(function(r){return r.json()})
  .then(function(){
    document.getElementById('syncAllBtn').textContent='Sync All Now';
    document.getElementById('syncAllBtn').disabled=false;
    loadAll();
  }).catch(function(){
    document.getElementById('syncAllBtn').textContent='Sync All Now';
    document.getElementById('syncAllBtn').disabled=false;
  });
}

function fmtDur(s){if(!s||!isFinite(s))return'0:00';var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}
function fmtSize(b){if(!b)return'0 KB';if(b<1048576)return Math.round(b/1024)+' KB';return (b/1048576).toFixed(1)+' MB'}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ── Tag toggle ──
function toggleTag(videoId, newTag){
  tags[videoId]=newTag;
  // Update local video objects
  for(var i=0;i<allVideos.length;i++){
    if(allVideos[i].videoId===videoId){allVideos[i].tag=newTag;break}
  }
  // Persist to server
  fetch(API+'/tags',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({videoId:videoId,tag:newTag})
  }).catch(function(){});
  showToast(newTag==='karaoke'?'Tagged as Karaoke':'Tagged as Music Video');
  renderVideos();
}

// ── Queue rendering ──
function renderQueue(){
  fetch(YTAPI+'/now-playing').then(function(r){return r.json()}).then(function(np){
    var npDiv=document.getElementById('queueNowPlaying');
    var npThumb=document.getElementById('queueNpThumb');
    var npTitle=document.getElementById('queueNpTitle');
    var npMeta=document.getElementById('queueNpMeta');
    if(np&&np.videoId){
      npDiv.style.display='flex';
      npThumb.src=np.thumbnail||('https://i.ytimg.com/vi/'+np.videoId+'/hqdefault.jpg');
      npTitle.textContent=np.title||np.videoId;
      var parts=(np.title||'').split(' - ');
      npMeta.textContent=np.duration?fmtDur(np.duration):(parts.length>=2?parts[0].trim():'');
    } else {
      npDiv.style.display='none';
    }
    nowPlaying=np;
    updatePlayerUI();
  }).catch(function(){document.getElementById('queueNowPlaying').style.display='none'});

  fetch(YTAPI+'/queue').then(function(r){return r.json()}).then(function(d){
    var items=d.queue||d||[];
    var list=document.getElementById('queueList');
    if(!Array.isArray(items)||items.length===0){
      list.innerHTML='<div class="queue-empty">Queue is empty</div>';
      return;
    }
    list.innerHTML=items.map(function(item,i){
      var vid=item.videoId||'';
      var qid=item.id||'';
      var title=item.title||vid;
      var thumb=item.thumbnail||(vid?'https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg':'');
      return '<div class="queue-item">'+
        '<div class="pos">#'+(i+1)+'</div>'+
        '<div class="thumb"><img src="'+esc(thumb)+'" onerror="this.parentElement.innerHTML=\'<span style=color:var(--text2);font-size:1.2rem>&#x1F3B5;</span>\'" loading="lazy"></div>'+
        '<div class="info">'+
          '<div class="title">'+esc(title)+'</div>'+
          '<div class="meta">'+esc(vid)+'</div>'+
        '</div>'+
        '<div class="actions">'+
          '<button onclick="queuePlayNow(\''+esc(vid)+'\')">Play Now</button>'+
          '<button onclick="queueMoveToTop(\''+esc(vid)+'\')">Top</button>'+
          '<button class="danger" onclick="queueRemove(\''+esc(qid)+'\')">Remove</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }).catch(function(){document.getElementById('queueList').innerHTML='<div class="queue-empty">Could not load queue</div>'});
}

function queuePlayNow(videoId){
  var url='https://www.youtube.com/watch?v='+videoId;
  fetch(YTAPI+'/play-now',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url:url})
  }).then(function(){showToast('Playing now');setTimeout(renderQueue,800)})
  .catch(function(){showToast('Failed')});
}

function queueMoveToTop(videoId){
  fetch(YTAPI+'/queue/move-top',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({videoId:videoId})
  }).then(function(){showToast('Moved to top');setTimeout(renderQueue,500)})
  .catch(function(){showToast('Failed')});
}

function queueRemove(queueItemId){
  fetch(YTAPI+'/queue/'+encodeURIComponent(queueItemId),{
    method:'DELETE'
  }).then(function(){showToast('Removed');setTimeout(renderQueue,500)})
  .catch(function(){showToast('Failed')});
}

// ── Init ──
loadAll();
pollNowPlaying();
startClockTick();

// Library data every 30s
setInterval(loadAll,30000);

// Now-playing every 5s (with clock sync)
setInterval(function(){
  pollNowPlaying();
  lastPollTime=Date.now();
},5000);

// Queue auto-refresh every 3s (only when queue tab is active)
setInterval(function(){
  if(document.getElementById('panelQueue').className.indexOf('hidden')===-1) renderQueue();
},3000);
</script>
