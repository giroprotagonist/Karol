name: android-dj

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci
          cd ./src/dj-controller && npm ci

      - name: Typecheck dj-controller
        run: npm run typecheck

      - name: Run dj-controller unit tests (vitest)
        run: cd src/dj-controller && npx vitest run

      - name: Run Android unit tests (player)
        run: cd android-player && ./gradlew test --no-daemon

      - name: Run Android unit tests (controller)
        run: cd android-controller && ./gradlew test --no-daemon

      - name: Build dj-controller bundle
        run: npm run buildDjController

      - name: Sync dj-controller to player assets
        run: bash ./scripts/sync-dj-controller-to-player.sh

      - name: Build android-player debug APK
        run: cd android-player && ./gradlew assembleDebug --no-daemon

      - name: Build android-controller debug APK
        run: cd android-controller && ./gradlew assembleDebug --no-daemon
