<script>
// ── Global error catch — prevents unhandled renderer crashes ──
window.addEventListener('error', function(e) {
  console.error('[player] GLOBAL ERROR:', e.error?.message || e.message, e);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('[player] UNHANDLED REJECTION:', e.reason?.message, e.reason);
});

// ── Karol Player — Battle-tested playback engine ──
// Uses disposable <video> elements per play to avoid stale state.
// Audio passes through natively in stereo — a persistent silent
// AudioContext anchor keeps Core Audio stable between songs.

const api = window.karolAPI;
const IS_MONITOR = new URLSearchParams(window.location.search).get('role') === 'monitor';
if (IS_MONITOR) {
  document.title = 'Karol Monitor (Singer)';
  document.body.classList.add('is-monitor');
  document.documentElement.style.cursor = 'default';
  document.body.style.cursor = 'default';
}
let playerState = 'idle';
let currentVideoId = null;
let isYouTube = false;
let progressTimer = null;
let youtubeFrame = document.getElementById('youtube-frame');
let queue = [];
let currentIndex = -1;
let playerVolume = 0.55; // synced from main; applied to every karaoke <video>
let lyricEngine = null;
let lyricOffset = 0; // Global lyric timing offset in seconds (for manual adjustment slider)

function applyPlayerVolume(el) {
  if (!el || IS_MONITOR) return;
  try {
    el.volume = Math.max(0, Math.min(1, playerVolume));
  } catch (_) {}
}

// ── Disposable video management (avoids createMediaElementSource reuse bug) ──
let currentVideoEl = null;
let fullLyricsLines = null; // stored for timed highlighting in sidebar
let loadTimeoutId = null;
const videoLayer = document.getElementById('video-layer');

function destroyVideo() {
  // Clear any pending load timeout
  if (loadTimeoutId) { clearTimeout(loadTimeoutId); loadTimeoutId = null; }

  stopMicBuddyAudio();

  // Remove old video element from DOM
  if (currentVideoEl) {
    try {
      currentVideoEl.pause();
      currentVideoEl.removeAttribute('src');
      currentVideoEl.load(); // releases decoder resources
      if (currentVideoEl.parentNode) currentVideoEl.parentNode.removeChild(currentVideoEl);
    } catch(e) { console.error('[player] Video cleanup error:', e.message); }
    currentVideoEl = null;
  }
  updateMicBuddyVisibility();
}

function createVideo() {
  // Create a fresh <video> element — no stale sources, no accumulated listeners
  var el = document.createElement('video');
  el.setAttribute('preload', 'auto');
  // Do NOT set crossorigin — karol-file:// has no CORS headers; anonymous mode
  // can stall local karaoke decode. Beat tap uses a parallel <audio> analyser.
  el.style.cssText = 'width:100%;height:100%;border:none;object-fit:contain;background:#000;display:block';
  // Singer monitor mirrors video+lyrics but must stay silent (HDMI owns audio)
  if (IS_MONITOR) {
    el.muted = true;
    el.volume = 0;
  } else {
    applyPlayerVolume(el);
  }

  // Attach event handlers (clean slate, no accumulation)
  el.addEventListener('play', function() {
    if (loadTimeoutId) { clearTimeout(loadTimeoutId); loadTimeoutId = null; }
    playerState = 'playing';
    hideLoading();
    startProgressTimer();
    console.log('[player] Video started playing');
  });

  el.addEventListener('pause', function() {
    if (playerState !== 'ended') {
      playerState = 'paused';
      stopProgressTimer();
      reportState({ state: 'paused' });
    }
  });

  el.addEventListener('ended', function() {
    console.log('[player] Video ended naturally');
    hideFinale();
    hideEntrance();
    playerState = 'ended';
    stopProgressTimer();
    reportState({ state: 'ended' });
  });

  el.addEventListener('error', function(e) {
    var err = el.error;
    console.error('[player] Video error:', err ? (err.code + ' ' + err.message) : 'unknown');
    if (loadTimeoutId) { clearTimeout(loadTimeoutId); loadTimeoutId = null; }
    hideLoading();
    reportState({ state: 'error', error: 'Video load error (code ' + (err ? err.code : '?') + ')' });
  });

  // Insert into the video layer (before overlays)
  videoLayer.insertBefore(el, videoLayer.firstChild);
  return el;
}

console.log('[player] Initializing IPC bridge...' + (IS_MONITOR ? ' (monitor)' : ''));
updateConnStatus('connected');

api.on('player-event', function(event) {
  console.log('[player] <-', event.type);
  switch (event.type) {
    case 'play':
      if (typeof event.volumeLevel === 'number') playerVolume = Math.max(0, Math.min(1, event.volumeLevel));
      handlePlay(event.videoId, event.isYouTube, event.title, event.requester);
      handleQueueUpdate(event.queue, event.currentIndex);
      break;
    case 'pause': handlePause(); break;
    case 'pause-interstitial': handlePauseInterstitial(event); break;
    case 'resume': handleResume(); break;
    case 'stop': setQrMode('corner'); pauseInterstitialActive = false; stopBroll(true); hideBetweenSongs(true); handleStop(); break;
    case 'seek': handleSeek(event.time); break;
    case 'sync-clock': handleSyncClock(event.time, event.state); break;
    case 'volume': handleVolume(event.level); break;
    case 'skip': handleSkip(); break;
    case 'between-songs-hold': /* timer held — keep B-roll spinning */ break;
    case 'between-songs-resume': /* countdown resumed */ break;
    case 'between-songs': handleBetweenSongs(event); break;
    case 'queue-update': handleQueueUpdate(event.queue, event.currentIndex); break;
    case 'toggle-lyric-slider': if (event.active) {
      // Load existing offset from disk before showing
      api.lyrics.getOffset(currentVideoId).then(function(r) {
        showLyricSlider(r && r.ok ? r.offset : 0);
      }).catch(function() { showLyricSlider(0); });
    } else { hideLyricSlider(); } break;
    case 'lyric-offset-updated': lyricOffset = event.offset || 0;
      document.getElementById('lyric-slider-input').value = lyricOffset;
      document.getElementById('lyric-offset-display').textContent = lyricOffset.toFixed(1) + 's';
      break;
    case 'lyrics-reload':
      // Controller saved edited lyrics — reload LRC for current track
      if (currentVideoId) {
        api.library.lyrics(currentVideoId).then(function(ly) {
          if (ly) {
            lyricEngine = new LyricEngine(ly);
            if (document.getElementById('full-lyrics').classList.contains('active') && ly.lines) {
              renderFullLyrics(ly.lines, ly.title || '');
            }
            console.log('[player] Lyrics reloaded after edit:', ly.lines ? ly.lines.length : 0, 'lines');
          }
        }).catch(function(e) { console.error('[player] lyrics reload failed:', e); });
      }
      break;
    case 'toggle-full-lyrics': if (event.active && event.lines && event.lines.length) {
      renderFullLyrics(event.lines, event.title || '');
    } else { hideFullLyrics(); } break;
    case 'fx': handleFx(event.name); break;
    case 'reaction': spawnReaction(event.emoji); break;
  }
});

var QR_TRIP_MS = 2200;
var qrTripAnim = null;
var qrMode = 'corner'; // corner | hero
var pauseInterstitialActive = false;

function getQrFly() { return document.getElementById('qr-fly'); }

function clearQrInlinePos(fly) {
  fly.style.top = '';
  fly.style.left = '';
  fly.style.right = '';
  fly.style.width = '';
  fly.style.maxHeight = '';
}

function setQrMode(mode) {
  var fly = getQrFly();
  if (!fly) return;
  if (mode === 'hero') {
    var slot = document.getElementById('bs-qr-slot');
    var layer = videoLayer.getBoundingClientRect();
    if (slot) {
      var slotR = slot.getBoundingClientRect();
      // If slot is laid out (between-songs visible), snap to it
      if (slotR.width > 40) {
        var labelH = 48; // room for "Song Requests" under the card
        // Slot is now the full center-row height — size the square to fit with label
        var maxByHeight = Math.max(120, (slotR.height || 0) - labelH - 8);
        var maxByLayer = Math.max(120, layer.height - (slotR.top - layer.top) - labelH - 12);
        var maxW = Math.max(120, Math.min(slotR.width || maxByHeight, maxByHeight, maxByLayer));
        fly.style.top = (slotR.top - layer.top) + 'px';
        fly.style.left = (slotR.left - layer.left) + 'px';
        fly.style.right = 'auto';
        fly.style.width = maxW + 'px';
        fly.style.maxHeight = Math.max(140, (slotR.height || maxByHeight) + 4) + 'px';
      }
    }
    fly.classList.add('mode-hero');
    fly.classList.remove('mode-corner');
  } else {
    clearQrInlinePos(fly);
    fly.classList.add('mode-corner');
    fly.classList.remove('mode-hero');
  }
  qrMode = mode;
  updateMicBuddyVisibility();
}

/** Prismatic FLIP trip between corner ↔ hero. */
function tripQr(toHero) {
  return new Promise(function(resolve) {
    if (IS_MONITOR) {
      setQrMode(toHero ? 'hero' : 'corner');
      resolve();
      return;
    }
    var fly = getQrFly();
    if (!fly) { resolve(); return; }

    var want = toHero ? 'hero' : 'corner';
    if (qrMode === want && !fly.classList.contains('tripping')) {
      resolve();
      return;
    }

    if (qrTripAnim) {
      try { qrTripAnim.cancel(); } catch (e) {}
      qrTripAnim = null;
    }

    var from = fly.getBoundingClientRect();
    setQrMode(want);
    void fly.offsetWidth;
    var to = fly.getBoundingClientRect();
    var dx = from.left - to.left;
    var dy = from.top - to.top;
    var sx = to.width ? from.width / to.width : 1;
    var sy = to.height ? from.height / to.height : 1;

    fly.classList.add('tripping');
    fly.style.zIndex = '70';

    qrTripAnim = fly.animate([
      {
        transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ') rotate(-12deg)',
        filter: 'hue-rotate(0deg) saturate(1.2) brightness(1.05)',
        offset: 0
      },
      {
        transform: 'translate(' + (dx * 0.62) + 'px,' + (dy * 0.18 - 48) + 'px) scale(' + ((sx + 1) / 2 * 1.5) + ') rotate(26deg)',
        filter: 'hue-rotate(110deg) saturate(2.8) brightness(1.4)',
        offset: 0.28
      },
      {
        transform: 'translate(' + (dx * 0.28) + 'px,' + (dy * 0.55 + 36) + 'px) scale(' + ((sx + 1) / 2 * 1.28) + ') rotate(-20deg)',
        filter: 'hue-rotate(230deg) saturate(2.3) brightness(1.45)',
        offset: 0.58
      },
      {
        transform: 'translate(' + (dx * 0.08) + 'px,' + (dy * 0.12) + 'px) scale(' + ((sx + 1) / 2 * 1.08) + ') rotate(6deg)',
        filter: 'hue-rotate(300deg) saturate(1.8) brightness(1.2)',
        offset: 0.82
      },
      {
        transform: 'none',
        filter: 'none',
        offset: 1
      }
    ], {
      duration: QR_TRIP_MS,
      easing: 'cubic-bezier(0.22, 1.15, 0.28, 1)',
      fill: 'forwards'
    });

    function finish() {
      fly.classList.remove('tripping');
      fly.style.transform = '';
      fly.style.filter = '';
      fly.style.zIndex = '';
      qrTripAnim = null;
      resolve();
    }
    qrTripAnim.onfinish = finish;
    qrTripAnim.oncancel = finish;
  });
}

// Never render a raw YouTube id (or '<id>-karaoke') as a song title.
function safeTitle(title, videoId) {
  var t = String(title || '').trim();
  var vid = String(videoId || '');
  var base = vid.replace(/-karaoke$/, '');
  if (!t) return '';
  if (t === vid || t === base || /^[A-Za-z0-9_-]{11}(-karaoke)?$/.test(t) || /^https?:\/\//i.test(t)) {
    return 'Loading title…';
  }
  return t;
}

function handlePlay(videoId, isYT, title, requester) {
  // Guard: don't restart the same video that's already playing
  if (currentVideoId === videoId && playerState === 'playing') return;

  // Bare play (no videoId) while paused → resume current track
  if (!videoId && (pauseInterstitialActive || playerState === 'paused')) {
    handleResume();
    return;
  }

  var start = function() {
    pauseInterstitialActive = false;
    currentVideoId = videoId;
    isYouTube = false;

    hideBetweenSongs(true);
    stopBroll(false);
    hideLyrics();
    hideFullLyrics();
    lyricEngine = null;
    stopProgressTimer();
    destroyVideo();

    currentSingerName = String(requester || '').trim();
    currentSongTitle = safeTitle(title, videoId);
    finaleShown = false;
    hideFinale();
    showEntrance(currentSingerName, currentSongTitle);

    updateMarquee(currentSongTitle, requester || '');
    showLoading('Loading...');

    // Always prefer local playback. YouTube embeds hit Error 153 in Electron
    // ("Video player configuration error") — playLocal downloads if needed.
    playLocal(videoId);
  };

  // Trip QR back to corner as the next track starts
  var betweenActive = document.getElementById('between-songs').classList.contains('active') || qrMode === 'hero';
  if (betweenActive && !IS_MONITOR) {
    // Fade interstitial while QR flies home, then start playback
    var el = document.getElementById('between-songs');
    if (el) el.classList.remove('active');
    tripQr(false).then(start);
  } else {
    setQrMode('corner');
    start();
  }
}

function handleBetweenSongs(event) {
  pauseInterstitialActive = false;
  hideFinale();
  hideEntrance();
  hideLoading();
  hideLyrics();
  hideFullLyrics();
  stopProgressTimer();
  destroyVideo();
  youtubeFrame.style.display = 'none';
  youtubeFrame.src = '';
  playerState = 'idle';
  currentVideoId = null;

  var singer = (event && event.singer) ? String(event.singer).trim() : '';
  var title = safeTitle(event && event.title, '');
  var labelEl = document.getElementById('bs-label');
  if (labelEl) labelEl.textContent = 'Up next';
  document.getElementById('bs-singer').textContent = (singer && !/^dj$/i.test(singer) && singer !== 'Next up') ? singer : 'Naynay';
  document.getElementById('bs-song').textContent = title || '';
  document.getElementById('between-songs').classList.add('active');
  document.getElementById('between-songs').setAttribute('aria-hidden', 'false');
  videoLayer.classList.add('between-active');
  document.body.classList.add('interstitial-on');
  if (event && event.queue) handleQueueUpdate(event.queue, event.currentIndex);
  updateMarquee(title || '', singer || '');
  console.log('[player] Between songs:', singer, title);
  updateMicBuddyVisibility();
  startBroll(event && event.brollVideoId);

  // Let layout settle, then prismatic flight corner → hero
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { tripQr(true); });
  });
}

/** Pause current video and show between-songs-style interstitial (does NOT advance queue). */
function handlePauseInterstitial(event) {
  if (!isYouTube && currentVideoEl) {
    try { currentVideoEl.pause(); } catch (e) {}
  }
  stopMicBuddyAudio();
  hideFinale();
  hideEntrance();
  pauseInterstitialActive = true;
  hideLoading();
  hideLyrics();
  // Keep karaoke video loaded under the overlay so resume can continue mid-track

  var singer = (event && event.singer) ? String(event.singer).trim() : '';
  var title = safeTitle(event && event.title, '');
  var label = (event && event.label) ? String(event.label).trim() : 'Up next';
  var labelEl = document.getElementById('bs-label');
  if (labelEl) labelEl.textContent = label || 'Up next';
  document.getElementById('bs-singer').textContent = (singer && !/^dj$/i.test(singer) && singer !== 'Next up') ? singer : (singer === 'Paused' ? 'Paused' : 'Naynay');
  document.getElementById('bs-song').textContent = title || '';
  document.getElementById('between-songs').classList.add('active');
  document.getElementById('between-songs').setAttribute('aria-hidden', 'false');
  videoLayer.classList.add('between-active');
  document.body.classList.add('interstitial-on');
  if (event && event.queue) handleQueueUpdate(event.queue, event.currentIndex);
  console.log('[player] Pause interstitial:', label, singer, title);
  updateMicBuddyVisibility();
  startBroll(event && event.brollVideoId);

  requestAnimationFrame(function() {
    requestAnimationFrame(function() { tripQr(true); });
  });
}

/** Hide pause interstitial, trip QR home, resume the same paused video. */
function handleResume() {
  var wasPause = pauseInterstitialActive;
  pauseInterstitialActive = false;

  var finish = function() {
    var labelEl = document.getElementById('bs-label');
    if (labelEl) labelEl.textContent = 'Up next';
    hideBetweenSongs(true);
    stopBroll(false);
    if (!isYouTube && currentVideoEl) {
      currentVideoEl.play().catch(function(e) {
        console.error('[player] Resume play failed:', e && e.message);
      });
      startMicBuddyAudio(currentVideoEl);
    }
    playerState = 'playing';
    startProgressTimer();
    reportState({ state: 'playing', currentTime: currentVideoEl ? currentVideoEl.currentTime : 0 });
    updateMicBuddyVisibility();
  };

  var el = document.getElementById('between-songs');
  var showing = (el && el.classList.contains('active')) || qrMode === 'hero' || wasPause;
  if (showing && !IS_MONITOR) {
    if (el) el.classList.remove('active');
    tripQr(false).then(finish);
  } else {
    setQrMode('corner');
    finish();
  }
}

function hideBetweenSongs(instant) {
  var el = document.getElementById('between-songs');
  if (el) {
    el.classList.remove('active');
    el.classList.remove('has-broll');
    el.setAttribute('aria-hidden', 'true');
  }
  videoLayer.classList.remove('between-active');
  document.body.classList.remove('interstitial-on');
  updateMicBuddyVisibility();
}

// ── Interstitial B-roll (random music video PiP) ──
let lastBrollId = null;
let brollFadeRaf = null;
let brollGen = 0; // bumps on each start/stop so ended handlers don't race

function setBrollTitle(text) {
  var el = document.getElementById('bs-broll-title');
  if (!el) return;
  el.textContent = text || '—';
  el.title = text || '';
}

function setBrollReclassStatus(msg, ok) {
  var el = document.getElementById('bs-reclass-status');
  if (!el) return;
  el.textContent = msg || '';
  el.style.color = ok === false ? '#f87171' : (ok ? '#4ade80' : 'rgba(240,192,64,0.9)');
}

function setBrollReclassActive(bucket) {
  var root = document.getElementById('bs-reclass');
  if (!root) return;
  var btns = root.querySelectorAll('.bs-reclass-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('active', btns[i].getAttribute('data-bucket') === bucket);
  }
}

var BROLL_RECLASS = {
  karaoke: { tag: 'karaoke', source: 'manual', label: 'Karaoke', bucket: 'karaoke' },
  custom: { tag: 'karaoke', source: 'karaoke-maker', label: 'Custom', bucket: 'custom' },
  music: { tag: 'music', source: 'manual', label: 'Music Video', bucket: 'music' },
};
var brollReclassBusy = false;

async function reclassifyBroll(bucket) {
  if (IS_MONITOR || brollReclassBusy) return;
  var target = BROLL_RECLASS[bucket];
  var videoId = lastBrollId;
  if (!target || !videoId) {
    setBrollReclassStatus('No video loaded', false);
    return;
  }
  if (!api.library || !api.library.reclassify) {
    setBrollReclassStatus('Reclassify unavailable', false);
    return;
  }
  brollReclassBusy = true;
  var root = document.getElementById('bs-reclass');
  if (root) {
    var btns = root.querySelectorAll('.bs-reclass-btn');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
  }
  setBrollReclassStatus('Saving…');
  try {
    var r = await api.library.reclassify(videoId, target.tag, target.source);
    if (!r || r.ok === false) {
      setBrollReclassStatus((r && r.error) || 'Failed', false);
      return;
    }
    // Keep base / -karaoke siblings in sync (same as controller)
    var base = String(videoId).replace(/-karaoke$/, '');
    var sibling = videoId === base ? base + '-karaoke' : base;
    if (sibling !== videoId) {
      try { await api.library.reclassify(sibling, target.tag, target.source); } catch (_) {}
    }
    setBrollReclassActive(target.bucket);
    var note = r.moved ? ('→ ' + target.label + ' (moved)') : ('→ ' + target.label);
    setBrollReclassStatus(note, true);
    // Left the Music Videos pool — skip to next from the start
    if (target.tag !== 'music' && target.tag !== 'song') {
      setTimeout(function() {
        if (!document.getElementById('between-songs')?.classList.contains('active')) return;
        startBroll(null, { fromStart: true });
      }, 350);
    }
  } catch (e) {
    setBrollReclassStatus((e && e.message) || 'Error', false);
  } finally {
    brollReclassBusy = false;
    if (root) {
      var btns2 = root.querySelectorAll('.bs-reclass-btn');
      for (var j = 0; j < btns2.length; j++) btns2[j].disabled = false;
    }
  }
}

async function resolveBrollTitle(videoId) {
  if (!videoId) return '';
  try {
    if (api.library && api.library.resolveTitles) {
      var res = await api.library.resolveTitles([videoId]);
      var t = res && res.titles && res.titles[videoId];
      if (t && String(t).trim()) return String(t).trim();
    }
  } catch (_) {}
  return '';
}

function fadeBrollVolume(el, from, to, ms) {
  return new Promise(function(resolve) {
    if (!el) return resolve();
    if (brollFadeRaf) cancelAnimationFrame(brollFadeRaf);
    var start = performance.now();
    el.volume = Math.max(0, Math.min(1, from));
    function step(now) {
      var t = Math.min(1, (now - start) / Math.max(1, ms));
      el.volume = Math.max(0, Math.min(1, from + (to - from) * t));
      if (t < 1) brollFadeRaf = requestAnimationFrame(step);
      else { brollFadeRaf = null; resolve(); }
    }
    brollFadeRaf = requestAnimationFrame(step);
  });
}

async function pickRandomMusicVideoId(preferred) {
  if (preferred && typeof preferred === 'string') {
    try {
      var prefPath = await api.library.filePath(preferred);
      if (prefPath) { lastBrollId = preferred; return { videoId: preferred, title: '' }; }
    } catch (_) {}
  }
  // Ask main for a pick — never pull the full tags map into the player (too heavy).
  try {
    if (api.library.randomMusic) {
      var r = await api.library.randomMusic();
      var id = r && r.videoId;
      if (id) {
        lastBrollId = id;
        return { videoId: id, title: (r && r.title) || '' };
      }
    }
  } catch (e) {
    console.warn('[player] broll randomMusic failed:', e && e.message);
  }
  return null;
}

async function startBroll(preferredId, opts) {
  var wrap = document.getElementById('broll-pip');
  var vid = document.getElementById('broll-video');
  var bs = document.getElementById('between-songs');
  if (!wrap || !vid) return;
  opts = opts || {};
  var fromStart = !!opts.fromStart;

  var gen = ++brollGen;

  // Tear down any previous broll without waiting
  try {
    vid.onended = null;
    vid.pause();
    vid.removeAttribute('src');
    vid.load();
  } catch (_) {}
  wrap.classList.remove('active', 'fading-out');
  wrap.setAttribute('aria-hidden', 'true');
  setBrollTitle('…');
  setBrollReclassStatus('');
  setBrollReclassActive('music');

  var id = preferredId || null;
  var knownTitle = '';
  if (!id) {
    var pick = await pickRandomMusicVideoId(null);
    if (pick) { id = pick.videoId; knownTitle = pick.title || ''; }
  } else {
    // Validate preferred; fall back to main pick if missing on disk
    try {
      var okPath = await api.library.filePath(id);
      if (!okPath) {
        var fb = await pickRandomMusicVideoId(null);
        if (fb) { id = fb.videoId; knownTitle = fb.title || ''; }
        else id = null;
      }
    } catch (_) {
      var fb2 = await pickRandomMusicVideoId(null);
      if (fb2) { id = fb2.videoId; knownTitle = fb2.title || ''; }
      else id = null;
    }
  }
  if (gen !== brollGen) return; // superseded
  if (!id) {
    console.warn('[player] No local music video available for interstitial broll');
    setBrollTitle('—');
    return;
  }
  lastBrollId = id;

  if (knownTitle) setBrollTitle(knownTitle);
  // Resolve / refresh title in parallel with media load
  resolveBrollTitle(id).then(function(title) {
    if (gen !== brollGen) return;
    setBrollTitle(title || knownTitle || safeTitle('', id) || id);
  });

  // Prefer karol-file:// for B-roll so mid-track seeks work (HTTP stream often
  // reports seekable=[0,0] until fully buffered). Fall back to range stream.
  var localPath = null;
  try { localPath = await api.library.filePath(id); } catch (_) {}
  if (gen !== brollGen) return;
  if (localPath) {
    vid.src = 'karol-file://' + encodeURI(localPath);
  } else {
    vid.src = 'http://127.0.0.1:3131/api/library/stream/' + encodeURIComponent(id);
  }
  vid.loop = false; // advance to a new random pick when this one ends
  vid.muted = !!IS_MONITOR;
  vid.volume = 0;
  // Show the PiP shell immediately so the interstitial never looks empty
  wrap.classList.add('active');
  wrap.setAttribute('aria-hidden', 'false');
  if (bs) bs.classList.add('has-broll');

  var started = false;
  var seekTarget = 0;

  function pickBrollStartTime(dur) {
    dur = Number(dur) || 0;
    // Random start in the first 2/3 — never in the last third — then play out to the end
    // so `ended` can advance to the next random Music Video.
    if (dur > 12) {
      var maxStart = dur * (2 / 3);
      var minStart = Math.min(dur * 0.05, maxStart * 0.25);
      return minStart + Math.random() * Math.max(0.5, maxStart - minStart);
    }
    if (dur > 3) return Math.random() * (dur * (2 / 3));
    return 0;
  }

  function seekBrollThenContinue(target) {
    if (gen !== brollGen) return Promise.resolve();
    target = Number(target) || 0;
    if (target <= 0.35) return Promise.resolve();
    return new Promise(function(resolve) {
      var settled = false;
      var finish = function() {
        if (settled) return;
        settled = true;
        vid.removeEventListener('seeked', onSeeked);
        resolve();
      };
      var onSeeked = function() { finish(); };
      vid.addEventListener('seeked', onSeeked);
      try {
        if (typeof vid.fastSeek === 'function') vid.fastSeek(target);
        else vid.currentTime = target;
      } catch (_) {
        try { vid.currentTime = target; } catch (__) {}
      }
      // If the engine ignored the seek (common before/around play on some streams), retry
      setTimeout(function() {
        if (settled || gen !== brollGen) return;
        var now = Number(vid.currentTime) || 0;
        if (Math.abs(now - target) > 1.25) {
          try { vid.currentTime = target; } catch (_) {}
          setTimeout(finish, 900);
        } else {
          finish();
        }
      }, 700);
      setTimeout(finish, 2500);
    });
  }

  var finishStart = function() {
    if (started || gen !== brollGen) return;
    started = true;
    // Pick mid-point here (not only in onMeta) so a slow-metadata timeout
    // can't start playback at 0 before seekTarget is set.
    if (!fromStart) {
      var durNow = Number(vid.duration) || 0;
      if (seekTarget <= 0.35 && durNow > 3) seekTarget = pickBrollStartTime(durNow);
    } else {
      seekTarget = 0;
    }
    vid.play().then(function() {
      if (gen !== brollGen) return;
      var doSeek = function() {
        return seekBrollThenContinue(seekTarget).then(function() {
          if (gen !== brollGen) return;
          // One more nudge if we still look like we never left the intro
          var t = Number(vid.currentTime) || 0;
          var d = Number(vid.duration) || 0;
          if (!fromStart && d > 12 && t < Math.min(4, d * 0.04) && seekTarget > 4) {
            return seekBrollThenContinue(seekTarget);
          }
        }).then(function() {
          if (gen !== brollGen) return;
          if (!IS_MONITOR) fadeBrollVolume(vid, 0, Math.max(0.05, playerVolume * 0.85), 550);
          console.log('[player] B-roll started:', id, fromStart ? 'fromStart' : 'mid',
            'at', Math.round(vid.currentTime) + 's /', Math.round(vid.duration || 0) + 's',
            '(target', Math.round(seekTarget) + 's)');
        });
      };
      // Tiny delay so play() has advanced past the first frame before seek
      return new Promise(function(r) { setTimeout(r, 60); }).then(doSeek);
    }).catch(function(e) {
      console.warn('[player] B-roll play failed:', e && e.message);
    });
  };

  var onMeta = function() {
    vid.removeEventListener('loadedmetadata', onMeta);
    if (gen !== brollGen) return;
    // First clip of an interstitial: random mid-track. Later clips (after end): start at 0.
    if (!fromStart) seekTarget = pickBrollStartTime(vid.duration);
    else seekTarget = 0;
    finishStart();
  };
  vid.addEventListener('loadedmetadata', onMeta);
  // Also catch canplay — some local files skip a useful loadedmetadata timing window
  vid.addEventListener('canplay', function onCanPlay() {
    vid.removeEventListener('canplay', onCanPlay);
    if (gen !== brollGen || started) return;
    if (!fromStart && seekTarget <= 0.35) seekTarget = pickBrollStartTime(vid.duration);
    finishStart();
  });
  vid.addEventListener('error', function() {
    if (gen !== brollGen) return;
    console.warn('[player] B-roll media error for', id, '— picking another');
    // Try a different track; keep mid-seek behavior for interstitial "first feel"
    // unless this start was explicitly fromStart (follow-on clips).
    setTimeout(function() {
      if (gen !== brollGen) return;
      if (!document.getElementById('between-songs')?.classList.contains('active')) return;
      startBroll(null, fromStart ? { fromStart: true } : null);
    }, 400);
  }, { once: true });
  vid.onended = function() {
    if (gen !== brollGen) return;
    if (!document.getElementById('between-songs')?.classList.contains('active')) return;
    console.log('[player] B-roll ended — next random from start');
    startBroll(null, { fromStart: true });
  };
  // If metadata is slow, still try to play — finishStart will pick seekTarget from duration
  setTimeout(function() {
    if (started || gen !== brollGen) return;
    finishStart();
  }, 2500);
}

function stopBroll(instant) {
  brollGen++; // cancel in-flight start / ended handlers
  var wrap = document.getElementById('broll-pip');
  var vid = document.getElementById('broll-video');
  var bs = document.getElementById('between-songs');
  if (bs) bs.classList.remove('has-broll');
  setBrollTitle('—');
  if (!vid) return Promise.resolve();

  // Drop ended/error handlers immediately so teardown can't spawn a fromStart follow-up
  try { vid.onended = null; } catch (_) {}

  var cleanup = function() {
    if (wrap) {
      wrap.classList.remove('active', 'fading-out');
      wrap.setAttribute('aria-hidden', 'true');
    }
    try {
      vid.onended = null;
      vid.pause();
      vid.removeAttribute('src');
      vid.load();
    } catch (_) {}
  };

  if (instant) {
    cleanup();
    return Promise.resolve();
  }
  if (wrap) wrap.classList.add('fading-out');
  var from = typeof vid.volume === 'number' ? vid.volume : 0;
  return fadeBrollVolume(vid, from, 0, 320).then(cleanup).catch(cleanup);
}

function playYouTube(videoId) {
  youtubeFrame.style.display = 'block';
  // youtube-nocookie + explicit referrerpolicy + origin avoids YouTube Error 153
  // ("Video player configuration error") in Electron embeds.
  youtubeFrame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  youtubeFrame.referrerPolicy = 'strict-origin-when-cross-origin';
  youtubeFrame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  var origin = encodeURIComponent('https://www.youtube.com');
  youtubeFrame.src = 'https://www.youtube-nocookie.com/embed/' + videoId
    + '?autoplay=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0'
    + '&iv_load_policy=3&playsinline=1&enablejsapi=1&origin=' + origin;

  playerState = 'playing';
  hideLoading();
  // YouTube iframe: no safe captureStream tap — idle dance only
  stopMicBuddyAudio();
  startMicBuddyIdle();
  updateMicBuddyVisibility();
}

async function playLocal(videoId) {
  youtubeFrame.style.display = 'none';
  youtubeFrame.src = '';

  var ytBase = String(videoId || '').replace(/-karaoke$/, '');
  var streamId = videoId;

  async function resolveLocalPath() {
    var p = await api.library.filePath(videoId);
    if (p) { streamId = videoId; return p; }
    if (ytBase && ytBase !== videoId) {
      p = await api.library.filePath(ytBase);
      if (p) { streamId = ytBase; return p; }
    }
    return null;
  }

  var filePath = await resolveLocalPath();
  if (!filePath) {
    // Prefer downloading locally — YouTube embeds hit Error 153 in Electron.
    if (/^[A-Za-z0-9_-]{11}$/.test(ytBase) && api.downloads && typeof api.downloads.start === 'function') {
      try {
        showLoading('Downloading for reliable playback…');
        console.warn('[player] No local media for ' + videoId + ' — starting local download');
        var downloadPromise = api.downloads.start(ytBase, false).catch(function(e) {
          console.warn('[player] download.start failed:', e && e.message);
          return null;
        });
        for (var i = 0; i < 120; i++) {
          filePath = await resolveLocalPath();
          if (filePath) break;
          try {
            var st = await api.downloads.status(ytBase);
            if (st && typeof st.progress === 'number' && st.progress > 0) {
              showLoading('Downloading… ' + Math.round(st.progress) + '%');
            } else if (i % 5 === 4) {
              showLoading('Still downloading… ' + (i + 1) + 's');
            }
          } catch (_) {
            if (i % 5 === 4) showLoading('Still downloading… ' + (i + 1) + 's');
          }
          await new Promise(function(r) { setTimeout(r, 1000); });
        }
        await downloadPromise;
        if (!filePath) filePath = await resolveLocalPath();
      } catch (e) {
        console.warn('[player] Local download trigger failed:', e && e.message);
      }
    }
  }

  if (!filePath) {
    // Do not fall back to YouTube embed — Error 153 is worse than a clear message.
    console.error('[player] No local media for ' + videoId + ' — refusing YouTube embed');
    showErrorOverlay('Video not downloaded yet. Wait for download, then play again.');
    reportState({ state: 'error', error: 'File not found' });
    return;
  }

  // Always dispose prior <video> before creating a new one (avoids stacked
  // elements if playLocal is invoked outside handlePlay).
  destroyVideo();

  // Create fresh video element (avoids createMediaElementSource bug)
  currentVideoEl = createVideo();

  // No Web Audio processing — audio passes through natively in stereo
  // to whatever output device is selected (BlackHole → Ableton)

  // Prefer the local HTTP range stream over karol-file://.
  // On external USB drives, karol-file:// has stalled at t=0 for some
  // music-video MP4s (metadata loads, play() resolves, currentTime never advances).
  // /api/library/stream serves the same file with proper Accept-Ranges.
  var streamUrl = 'http://127.0.0.1:3131/api/library/stream/' + encodeURIComponent(streamId);
  currentVideoEl.src = streamUrl;
  applyPlayerVolume(currentVideoEl);

  // ── 10-second load timeout: if video doesn't start, auto-skip ──
  loadTimeoutId = setTimeout(function() {
    console.error('[player] LOAD TIMEOUT — video failed to start within 10s');
    showErrorOverlay('Video failed to load (timeout)');
    reportState({ state: 'error', error: 'Load timeout (10s)' });
    currentVideoEl.pause();
  }, 10000);

  var played = false;
  try {
    await currentVideoEl.play();
    if (played) return;
    played = true;
    if (loadTimeoutId) { clearTimeout(loadTimeoutId); loadTimeoutId = null; }
    playerState = 'playing';
    hideLoading();
    startProgressTimer();
    reportState({ state: 'playing' });
    startMicBuddyAudio(currentVideoEl);
    updateMicBuddyVisibility();
    console.log('[player] Video started playing successfully');
  } catch(err) {
    if (played) return;
    played = true;
    console.error('[player] Play error:', err.name, err.message);
    if (err.name === 'NotAllowedError') {
      hideLoading();
      showLoading('Click anywhere to start playback');
      var resumeOnce = function() {
        currentVideoEl.play().then(function() {
          playerState = 'playing'; hideLoading();
          startProgressTimer(); reportState({ state: 'playing' });
          startMicBuddyAudio(currentVideoEl);
          updateMicBuddyVisibility();
        }).catch(function(e2) {
          console.error('[player] Resume play also failed:', e2.message);
          hideLoading();
          reportState({ state: 'error', error: 'Play blocked: ' + e2.message });
        });
        document.removeEventListener('click', resumeOnce);
        document.removeEventListener('keydown', resumeOnce);
      };
      document.addEventListener('click', resumeOnce, { once: true });
      document.addEventListener('keydown', resumeOnce, { once: true });
    } else {
      hideLoading();
      reportState({ state: 'error', error: err.message });
    }
  }

  // Load lyrics (non-blocking — plays with or without them)
  try {
    var ly = await api.library.lyrics(videoId);
    if (ly) {
      lyricEngine = new LyricEngine(ly);
      console.log('[player] Lyrics loaded:', ly.lines ? ly.lines.length : 0, 'lines');
    } else {
      lyricEngine = null;
    }
  } catch(lyricErr) {
    console.error('[player] Lyrics load failed:', lyricErr.message);
    lyricEngine = null;
  }

}

function handlePause() {
  // Prefer interstitial when main sends pause-interstitial; this is a plain pause fallback
  if (!isYouTube && currentVideoEl) currentVideoEl.pause();
  updateMicBuddyVisibility();
}

function handleStop() {
  hideFinale();
  hideEntrance();
  destroyVideo();
  hideFullLyrics();
  if (isYouTube) { youtubeFrame.src = ''; youtubeFrame.style.display = 'none'; }
  playerState = 'idle'; currentVideoId = null;
  stopProgressTimer(); hideLoading();
  updateMicBuddyVisibility();
}

function handleSkip() {
  // Main process already advanced the queue — just tear down current playback
  stopProgressTimer();
  hideLyrics();
  hideFullLyrics();
  destroyVideo();
}

function handleSeek(time) {
  if (!isYouTube && currentVideoEl) currentVideoEl.currentTime = time;
}

// Keep singer monitor locked to HDMI player clock (drift correction)
function handleSyncClock(time, state) {
  if (!IS_MONITOR || isYouTube || !currentVideoEl) return;
  if (typeof time === 'number' && !isNaN(time)) {
    var drift = Math.abs((currentVideoEl.currentTime || 0) - time);
    if (drift > 0.15) {
      try { currentVideoEl.currentTime = time; } catch (e) {}
    }
  }
  if (state === 'paused' && !currentVideoEl.paused) {
    try { currentVideoEl.pause(); } catch (e) {}
  } else if (state === 'playing' && currentVideoEl.paused && playerState !== 'ended') {
    currentVideoEl.play().catch(function() {});
  }
}

function handleVolume(level) {
  if (typeof level === 'number' && isFinite(level)) {
    playerVolume = Math.max(0, Math.min(1, level));
  }
  if (IS_MONITOR) {
    if (currentVideoEl) { currentVideoEl.muted = true; currentVideoEl.volume = 0; }
    return;
  }
  applyPlayerVolume(currentVideoEl);
  // Keep interstitial B-roll in the same ballpark (slightly under karaoke)
  var broll = document.getElementById('broll-video');
  if (broll && !broll.paused) {
    try { broll.volume = Math.max(0, Math.min(1, playerVolume * 0.85)); } catch (_) {}
  }
  console.log('[player] Volume set to', playerVolume);
}

// ── Audio stability anchor ──
// A persistent, silent AudioContext keeps macOS Core Audio from
// resetting the aggregate device (BlackHole + U-Phoria) between
// songs. No audio is routed through it — it just holds the session open.
// Skip on singer monitor (muted mirror; HDMI player owns the audio session).
(function anchorAudio() {
  if (IS_MONITOR) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    // Create a silent oscillator to keep the context "active"
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    console.log('[player] Audio anchor: AudioContext created at', ctx.sampleRate, 'Hz, state:', ctx.state);
      ctx.onstatechange = function() {
        console.log('[player] Audio anchor state change ->', ctx.state);
        // Attempt to resume if the system suspends it
        if (ctx.state === 'suspended') {
          ctx.resume().catch(function(e) {
            console.error('[player] Audio anchor resume failed:', e.message);
          });
        }
      };
  } catch(e) {
    console.error('[player] Audio anchor creation failed:', e.message);
  }
})();

// ── Karaoke dancing donkey (HDMI only) ──
// Beat tap uses a parallel muted <audio> with the same karol-file src →
// MediaElementSource → Analyser. Never captureStream / createMediaElementSource
// on the playing <video> (those were observed to stall or kill HDMI decode).
// YouTube / missing src → idle dance + clock pulse.
var micBuddyEl = document.getElementById('donkey-buddy');
var micBuddyRaf = null;
var micBuddyCtx = null;
var micBuddyAnalyser = null;
var micBuddyFreq = null;
var micBuddyMode = 'idle'; // idle | analyse
var micBuddyEnergy = 0;
var micBuddyBass = 0;
var micBuddyTempo = 1; // animation speed multiplier (BPM / 120-ish)
var micBuddyBpm = 120;
var micBuddyPrevSpec = null;
var micBuddyOnsetTimes = [];
var micBuddyLastMode = 'chill';
var micBuddyHitFlash = 0;
var micBuddySpinKick = 0;
var micBuddySlowmo = 1;
var micBuddyArmTimer = null;
var micBuddySyncTimer = null;
var micBuddyWatchTimer = null;
var micBuddyTapEl = null;
var micBuddyLogged = false;
var MIC_MODES = ['chill', 'groove', 'frenzy', 'peak'];

// ── Lottie dance rig (bundled offline in dance-moves.js) ──
// One rigged dancer per energy tier, rotated every ~8 bars within the tier
// so long steady sections don't loop the same move forever. If the runtime
// or animation data is missing/broken, the hand-rolled SVG donkey below
// stays as the fallback and the widget never disappears.
var dkLottie = null;
var dkLottieOk = false;
var dkLottieMove = null;
var dkLottieContainer = document.getElementById('dk-lottie');
var dkMoveSwitchAt = 0;
var dkLastSpeed = 0;
var dkBeatAccum = 0;
var dkLastTickTime = 0;
var dkRotFlip = false;
var dkSilentSince = 0;
var dkSilent = false;
var DK_MOVE_POOLS = {
  chill:  ['chicken', 'bear'],
  groove: ['bear', 'raccoon'],
  frenzy: ['raccoon', 'bear'],
  peak:   ['raccoon', 'floss']
};

function dkLottieLoad(move) {
  if (!dkLottieOk || move === dkLottieMove) return;
  try {
    var data = window.KAROL_DANCES[move];
    if (!data) return;
    if (dkLottie) { try { dkLottie.destroy(); } catch (e) {} dkLottie = null; }
    // Deep-copy: lottie mutates animationData, which breaks re-loading a move
    dkLottie = lottie.loadAnimation({
      container: dkLottieContainer,
      renderer: 'svg',
      loop: true,
      autoplay: true,
      animationData: JSON.parse(JSON.stringify(data)),
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
    });
    dkLottie.setSpeed(dkLastSpeed || 1);
    dkLottieMove = move;
    dkMoveSwitchAt = performance.now();
  } catch (e) {
    dkLottieOk = false;
    if (micBuddyEl) micBuddyEl.classList.remove('lottie-on');
    console.log('[donkey-buddy] lottie move load failed, SVG donkey fallback:', e && e.message);
  }
}

function dkLottieInit() {
  if (IS_MONITOR || !micBuddyEl || !dkLottieContainer) return;
  if (!window.lottie || !window.KAROL_DANCES) {
    console.log('[donkey-buddy] lottie runtime/assets missing, SVG donkey fallback');
    return;
  }
  dkLottieOk = true;
  micBuddyEl.classList.add('lottie-on');
  dkLottieLoad('bear');
  if (dkLottieOk) {
    console.log('[donkey-buddy] lottie dance rig active: ' + Object.keys(window.KAROL_DANCES).join(', '));
  }
}
dkLottieInit();

function micBuddySetMode(mode) {
  if (!micBuddyEl || mode === micBuddyLastMode) return;
  for (var i = 0; i < MIC_MODES.length; i++) {
    micBuddyEl.classList.toggle('mode-' + MIC_MODES[i], MIC_MODES[i] === mode);
  }
  micBuddyLastMode = mode;
}

function updateMicBuddyVisibility() {
  if (!micBuddyEl || IS_MONITOR) return;

  var hide = pauseInterstitialActive
    || qrMode === 'hero'
    || (between && between.classList.contains('active'))

  micBuddyEl.setAttribute('aria-hidden', hide ? 'true' : 'false');

    micBuddyEl.style.setProperty('--squash', '1');
    micBuddyEl.style.setProperty('--tilt', '0deg');
    micBuddyEl.style.setProperty('--shake-x', '0px');
    micBuddyEl.style.setProperty('--shake-y', '0px');
    micBuddyEl.style.setProperty('--spin', '0deg');
    micBuddyEl.style.setProperty('--flash', '0');
    micBuddyEl.style.setProperty('--tempo', '1');
    micBuddyEl.style.setProperty('--hue', '0deg');
    micBuddyEl.style.setProperty('--burst', '0');
    micBuddyEl.style.setProperty('--bpm', '120');

  }
}

function micBuddyClearTimers() {
  if (micBuddyArmTimer) { clearTimeout(micBuddyArmTimer); micBuddyArmTimer = null; }
  if (micBuddySyncTimer) { clearInterval(micBuddySyncTimer); micBuddySyncTimer = null; }
  if (micBuddyWatchTimer) { clearInterval(micBuddyWatchTimer); micBuddyWatchTimer = null; }
}

function micBuddyDestroyTap() {
  if (micBuddyTapEl) {
    try {
      micBuddyTapEl.pause();
      micBuddyTapEl.removeAttribute('src');
      micBuddyTapEl.load();
      if (micBuddyTapEl.parentNode) micBuddyTapEl.parentNode.removeChild(micBuddyTapEl);
    } catch (e) {}
    micBuddyTapEl = null;
  }
}

function stopMicBuddyAudio() {
  micBuddyClearTimers();
  if (micBuddyRaf) {
    cancelAnimationFrame(micBuddyRaf);
    micBuddyRaf = null;
  }
  micBuddyDestroyTap();
  micBuddyAnalyser = null;
  micBuddyFreq = null;
  micBuddyPrevSpec = null;
  micBuddyOnsetTimes = [];
  micBuddyMode = 'idle';
  if (micBuddyCtx) {
    try { micBuddyCtx.close(); } catch (e) {}
    micBuddyCtx = null;
  }
}

function startMicBuddyIdle() {
  if (IS_MONITOR) return;
  micBuddyMode = 'idle';
  if (micBuddyRaf) return;
  micBuddyTick();
}

function micBuddyDetachAnalyser(reason) {
  micBuddyDestroyTap();
  micBuddyAnalyser = null;
  micBuddyFreq = null;
  micBuddyPrevSpec = null;
  micBuddyOnsetTimes = [];
  micBuddyMode = 'idle';
  if (micBuddyCtx) {
    try { micBuddyCtx.close(); } catch (e) {}
    micBuddyCtx = null;
  }
  if (micBuddySyncTimer) { clearInterval(micBuddySyncTimer); micBuddySyncTimer = null; }
  if (!micBuddyLogged) {
    micBuddyLogged = true;
    console.log('[donkey-buddy] analyser detached → idle:', reason || 'unknown');
  }
}

function micBuddyArmAnalyser(videoEl) {
  if (!videoEl || IS_MONITOR) return false;
  var srcUrl = videoEl.currentSrc || videoEl.src;
  if (!srcUrl) {
    if (!micBuddyLogged) {
      micBuddyLogged = true;
      console.log('[donkey-buddy] analysis unavailable, idle dance: no media src');
    }
    return false;
  }
  try {
    var tap = document.createElement('audio');
    tap.preload = 'auto';
    tap.setAttribute('playsinline', '');
    // Keep out of layout / a11y; MediaElementSource still receives samples
    tap.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
    tap.src = srcUrl;
    document.body.appendChild(tap);
    micBuddyTapEl = tap;

    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var src = ctx.createMediaElementSource(tap);
    var analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.55;
    // Analyse only — never connect to destination (would hear a second mix)
    src.connect(analyser);

    micBuddyCtx = ctx;
    micBuddyAnalyser = analyser;
    micBuddyFreq = new Uint8Array(analyser.frequencyBinCount);
    micBuddyMode = 'analyse';
    micBuddyPrevSpec = null;
    micBuddyOnsetTimes = [];
    if (ctx.state === 'suspended') ctx.resume().catch(function() {});

    // Sync tap clock to the HDMI video; pause with it
    var syncOnce = function() {
      if (!micBuddyTapEl || !currentVideoEl || currentVideoEl !== videoEl) return;
      try {
        var vt = videoEl.currentTime || 0;
        var drift = Math.abs((micBuddyTapEl.currentTime || 0) - vt);
        if (drift > 0.35) micBuddyTapEl.currentTime = vt;
        if (videoEl.paused || playerState !== 'playing') {
          if (!micBuddyTapEl.paused) micBuddyTapEl.pause();
        } else if (micBuddyTapEl.paused) {
          micBuddyTapEl.play().catch(function() {});
        }
      } catch (e) {}
    };
    try { tap.currentTime = videoEl.currentTime || 0; } catch (e) {}
    tap.play().catch(function(e) {
      micBuddyDetachAnalyser('tap play failed: ' + (e && e.message));
      startMicBuddyIdle();
    });
    micBuddySyncTimer = setInterval(syncOnce, 400);

    // If the main video freezes, drop analysis (don't fight decode)
    var lastT = videoEl.currentTime || 0;
    var stuck = 0;
    micBuddyWatchTimer = setInterval(function() {
      if (!currentVideoEl || currentVideoEl !== videoEl) {
        micBuddyDetachAnalyser('video replaced');
        return;
      }
      if (videoEl.paused || playerState !== 'playing') {
        stuck = 0;
        lastT = videoEl.currentTime || 0;
        return;
      }
      var t = videoEl.currentTime || 0;
      if (t <= lastT + 0.01) {
        stuck++;
        if (stuck >= 6) { // ~2.4s frozen
          micBuddyDetachAnalyser('playback stalled with analysis tap');
          startMicBuddyIdle();
        }
      } else {
        stuck = 0;
        lastT = t;
      }
    }, 400);

    if (!micBuddyLogged) {
      micBuddyLogged = true;
      console.log('[donkey-buddy] parallel audio analyser armed');
    }
    return true;
  } catch (e) {
    micBuddyDestroyTap();
    if (!micBuddyLogged) {
      micBuddyLogged = true;
      console.log('[donkey-buddy] analysis unavailable, idle dance:', e && e.message);
    }
    micBuddyMode = 'idle';
    return false;
  }
}

function startMicBuddyAudio(videoEl) {
  stopMicBuddyAudio();
  micBuddyLogged = false;
  if (IS_MONITOR || !videoEl) {
    startMicBuddyIdle();
    return;
  }
  // Idle immediately so the donkey is visible; arm analyser once A/V is healthy
  startMicBuddyIdle();
  var attempts = 0;
  function tryArm() {
    micBuddyArmTimer = null;
    if (!currentVideoEl || currentVideoEl !== videoEl) return;
    if (videoEl.paused || playerState !== 'playing') {
      if (attempts++ < 20) {
        micBuddyArmTimer = setTimeout(tryArm, 200);
      } else if (!micBuddyLogged) {
        micBuddyLogged = true;
        console.log('[donkey-buddy] analysis unavailable, idle dance: video never playing');
      }
      return;
    }
    var t = videoEl.currentTime || 0;
    if (t < 0.15 && attempts < 25) {
      attempts++;
      micBuddyArmTimer = setTimeout(tryArm, 120);
      return;
    }
    micBuddyArmAnalyser(videoEl);
  }
  micBuddyArmTimer = setTimeout(tryArm, 180);
}

function micBuddyEstimateTempo(flux, now) {
  // Spectral-flux onset → rolling BPM estimate
  if (flux > 0.18) {
    var last = micBuddyOnsetTimes[micBuddyOnsetTimes.length - 1];
    if (!last || now - last > 180) {
      micBuddyOnsetTimes.push(now);
      if (micBuddyOnsetTimes.length > 12) micBuddyOnsetTimes.shift();
      micBuddyHitFlash = 1;
      if (flux > 0.32) micBuddySpinKick = 1;
    }
  }
  if (micBuddyOnsetTimes.length >= 4) {
    var intervals = [];
    for (var i = 1; i < micBuddyOnsetTimes.length; i++) {
      var dt = micBuddyOnsetTimes[i] - micBuddyOnsetTimes[i - 1];
      if (dt > 220 && dt < 1400) intervals.push(dt);
    }
    if (intervals.length) {
      intervals.sort(function(a, b) { return a - b; });
      var mid = intervals[Math.floor(intervals.length / 2)];
      var bpm = 60000 / mid;
      // Fold into musical range
      while (bpm < 70) bpm *= 2;
      while (bpm > 190) bpm /= 2;
      micBuddyBpm += (bpm - micBuddyBpm) * 0.12;
    }
  }
  // Map BPM → animation tempo: keep the range tighter so fast songs don't go frantic
  var t = micBuddyBpm / 120;
  micBuddyTempo += (Math.max(0.75, Math.min(1.35, t)) - micBuddyTempo) * 0.06;
}

function micBuddyPickMode(beat, tempo) {
  // Higher gates — spend more time in chill/groove; peak is rare
  var score = beat * 0.65 + (tempo - 0.8) * 0.25;
  if (score > 0.92 || (beat > 0.88 && tempo > 1.2)) return 'peak';
  if (score > 0.68 || beat > 0.72) return 'frenzy';
  if (score > 0.38 || beat > 0.42) return 'groove';
  return 'chill';
}

function micBuddyTick() {
  if (!micBuddyEl || IS_MONITOR) return;
  var now = performance.now();
  var energy = 0;
  var bass = 0;
  var flux = 0;

  if (micBuddyMode === 'analyse' && micBuddyAnalyser && micBuddyFreq) {
    micBuddyAnalyser.getByteFrequencyData(micBuddyFreq);
    var len = micBuddyFreq.length;
    var bassN = Math.min(16, len);
    var midN = Math.min(48, len);
    var bassSum = 0, midSum = 0, fluxSum = 0;
    for (var i = 0; i < len; i++) {
      var v = micBuddyFreq[i] / 255;
      if (i < bassN) bassSum += v * (1.4 - i / bassN * 0.5);
      if (i < midN) midSum += v;
      if (micBuddyPrevSpec) {
        var d = v - micBuddyPrevSpec[i];
        if (d > 0) fluxSum += d;
        micBuddyPrevSpec[i] = v;
      }
    }
    if (!micBuddyPrevSpec) {
      micBuddyPrevSpec = new Float32Array(len);
      for (var j = 0; j < len; j++) micBuddyPrevSpec[j] = micBuddyFreq[j] / 255;
    }
    bass = bassSum / (bassN * 1.1);
    energy = midSum / (midN * 0.95);
    flux = fluxSum / (len * 0.35);
    micBuddyEstimateTempo(flux, now);
  } else if (currentVideoEl && !currentVideoEl.paused) {
    // Gentle idle pulse keyed to playback clock
    var t = currentVideoEl.currentTime || 0;
    var pulse = Math.abs(Math.sin(t * Math.PI * 1.6));
    var kick = Math.abs(Math.sin(t * Math.PI * 0.8));
    energy = 0.22 + 0.22 * pulse + 0.1 * kick;
    bass = 0.2 + 0.25 * kick;
    flux = pulse > 0.96 ? 0.22 : 0.03;
    micBuddyBpm = 108 + 12 * Math.sin(t * 0.05);
    micBuddyTempo = 0.88 + 0.18 * pulse + 0.08 * kick;
    if (flux > 0.2) { micBuddyHitFlash = 0.45; micBuddySpinKick = 0.25; }
  } else {
    var idleT = now / 1000;
    energy = 0.18 + 0.14 * Math.abs(Math.sin(idleT * 1.4));
    bass = 0.16 + 0.1 * Math.abs(Math.sin(idleT * 0.9));
    micBuddyTempo = 0.9 + 0.1 * Math.abs(Math.sin(idleT * 0.5));
    if (Math.sin(idleT * 1.8) > 0.97) { micBuddyHitFlash = 0.35; micBuddySpinKick = 0.15; }
  }

  micBuddyEnergy += (energy - micBuddyEnergy) * 0.18;
  micBuddyBass += (bass - micBuddyBass) * 0.22;
  micBuddyHitFlash *= 0.9;
  micBuddySpinKick *= 0.93;

  var beat = Math.max(0, Math.min(1, micBuddyEnergy * 0.55 + micBuddyBass * 0.55));
  var hit = micBuddyHitFlash;
  var mode = micBuddyPickMode(beat, micBuddyTempo);
  micBuddySetMode(mode);

  // ── Silence gate: real analyser + low energy for >1.2s → near-still ──
  if (micBuddyMode === 'analyse') {
    if (beat < 0.13) {
      if (!dkSilentSince) dkSilentSince = now;
      if (now - dkSilentSince > 1200) dkSilent = true;
    } else if (beat > 0.18) {
      dkSilentSince = 0;
      dkSilent = false;
    }
  } else {
    dkSilentSince = 0;
    dkSilent = false;
  }

  // ── Lottie dance rig drive ──
  if (dkLottieOk && dkLottie) {
    // Count beats to rotate moves every ~8 bars (32 beats) within a tier
    var dt = dkLastTickTime ? Math.min(0.1, (now - dkLastTickTime) / 1000) : 0;
    dkBeatAccum += dt * (micBuddyBpm / 60);
    if (dkBeatAccum >= 32) {
      dkBeatAccum = 0;
      dkRotFlip = !dkRotFlip;
    }
    var pool = DK_MOVE_POOLS[mode] || DK_MOVE_POOLS.chill;
    var desired = dkSilent ? 'chicken' : pool[dkRotFlip && pool.length > 1 ? 1 : 0];
    if (desired !== dkLottieMove && now - dkMoveSwitchAt > 2500) {
      dkLottieLoad(desired);
    }
    // Playback speed tracks tempo gently — never frantic
    var speed;
    if (dkSilent) {
      speed = 0.12; // barely breathing while the room is quiet
    } else {
      speed = micBuddyTempo * (0.55 + beat * 0.35) + hit * 0.12;
      speed = Math.max(0.2, Math.min(1.25, speed));
    }
    if (Math.abs(speed - dkLastSpeed) > 0.03) {
      dkLastSpeed = speed;
      try { dkLottie.setSpeed(speed); } catch (e) {}
    }
  }
  dkLastTickTime = now;

  // Near-still when silent: damp all container motion, keep a whisper of sway
  var live = dkSilent ? 0.1 : 1;
  beat = beat * live;
  hit = hit * live;

  // Prefer slightly slower periods; avoid sudden snaps
  var targetSlow;
  if (hit > 0.5) targetSlow = 0.92;
  else if (beat < 0.22) targetSlow = 1.4;
  else if (beat < 0.4) targetSlow = 1.2;
  else if (beat < 0.6) targetSlow = 1.08;
  else targetSlow = 1.0;
  var slowBlend = hit > 0.5 ? 0.18 : 0.05;
  micBuddySlowmo += (targetSlow - micBuddySlowmo) * slowBlend;

  // Soft hop/squash/tilt — groove in place, not a seizure
  var weight = 1.05 / Math.max(0.8, Math.min(1.35, micBuddyTempo));
  var amp = dkLottieOk ? 0.28 : 0.55;
  var hop = -Math.round((beat * 14 + hit * 10) * weight * amp);
  var squash = (1 + (beat * 0.1 + hit * 0.08) * amp).toFixed(3);
  var tilt = (((beat - 0.35) * 8 + (hit - 0.35) * 5 * Math.sin(now / 140)) * amp).toFixed(2) + 'deg';
  var glow = (0.12 + beat * 0.35 + hit * 0.15).toFixed(3);
  var shakeX = ((hit * 3 + beat * 1.2) * Math.sin(now / 55) * amp).toFixed(1) + 'px';
  var shakeY = ((hit * 2.5 + beat * 1) * Math.cos(now / 48) * amp).toFixed(1) + 'px';
  var spin = (micBuddySpinKick * 8 * Math.sin(now / 90) * amp).toFixed(1) + 'deg';
  var flash = Math.max(0, Math.min(1, hit * 0.45 + (mode === 'peak' ? beat * 0.12 : 0))).toFixed(3);
  var burst = Math.max(0, Math.min(1, hit * 0.35 + (mode === 'peak' || mode === 'frenzy' ? beat * 0.18 : beat * 0.06))).toFixed(3);
  var hue = Math.round(beat * 12 + hit * 18 + (mode === 'peak' ? now / 20 % 360 * 0.05 : 0));
  // Lottie characters have real palettes — big hue-rotate turns them green.
  if (dkLottieOk) hue = Math.min(hue, 4);

  micBuddyEl.style.setProperty('--beat', beat.toFixed(3));
  micBuddyEl.style.setProperty('--glow', glow);
  micBuddyEl.style.setProperty('--hop', hop + 'px');
  micBuddyEl.style.setProperty('--squash', squash);
  micBuddyEl.style.setProperty('--tilt', tilt);
  micBuddyEl.style.setProperty('--shake-x', shakeX);
  micBuddyEl.style.setProperty('--shake-y', shakeY);
  micBuddyEl.style.setProperty('--spin', spin);
  micBuddyEl.style.setProperty('--flash', flash);
  micBuddyEl.style.setProperty('--tempo', micBuddyTempo.toFixed(3));
  micBuddyEl.style.setProperty('--bpm', Math.round(micBuddyBpm).toString());
  micBuddyEl.style.setProperty('--slowmo', micBuddySlowmo.toFixed(3));
  micBuddyEl.style.setProperty('--hue', hue + 'deg');
  micBuddyEl.style.setProperty('--burst', burst);
  micBuddyEl.classList.toggle('hot', beat > 0.72 || hit > 0.55);
  micBuddyRaf = requestAnimationFrame(micBuddyTick);
}

function handleQueueUpdate(newQueue, newIndex) {
  queue = newQueue || [];
  currentIndex = newIndex !== undefined ? newIndex : -1;
  renderMarquee();
}

// ── Progress ──

function startProgressTimer() {
  stopProgressTimer();
  progressTimer = setInterval(function() {
    var ct = 0, dur = 0;
    if (currentVideoEl) { ct = currentVideoEl.currentTime || 0; dur = currentVideoEl.duration || 0; }
    reportState({ state: playerState, currentTime: ct, duration: dur });
    if (lyricEngine) lyricEngine.update(ct);
    highlightFullLyrics(ct);
    maybeShowFinale(ct, dur);
  }, 500);
}

function stopProgressTimer() {
  if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
}

function reportState(state) {
  // Monitor is a silent mirror — HDMI player alone drives queue advance / status UI
  if (IS_MONITOR) return;
  try {
    api.reportState({
      videoId: currentVideoId, isYouTube: isYouTube,
      currentTime: state.currentTime || 0, duration: state.duration || 0,
      state: state.state || playerState, error: state.error || null
    });
  } catch(e) {}
}

var ENTRANCE_THEMES = [

function showEntrance(singer, title) {
  if (IS_MONITOR || !singer) return;
  var el = document.getElementById('entrance');
  if (!el) return;
  if (entranceTimer) { clearTimeout(entranceTimer); entranceTimer = null; }

  var theme = ENTRANCE_THEMES[Math.floor(Math.random() * ENTRANCE_THEMES.length)];
  el.style.setProperty('--en-a', theme.a);
  el.style.setProperty('--en-b', theme.b);
  document.getElementById('en-label').textContent = theme.label;
  document.getElementById('en-name').textContent = singer;
  document.getElementById('en-song').textContent = title || '';

  // Fresh particle burst each time
  Array.prototype.slice.call(el.querySelectorAll('.en-p')).forEach(function(p) { p.remove(); });
  for (var i = 0; i < 36; i++) {
    var p = document.createElement('div');
    p.className = 'en-p';
    p.style.setProperty('--x', (Math.random() * 100) + '%');
    p.style.setProperty('--sz', (6 + Math.random() * 12) + 'px');
    p.style.setProperty('--c', theme.confetti[i % theme.confetti.length]);
    p.style.setProperty('--dur', (2.2 + Math.random() * 2) + 's');
    p.style.setProperty('--delay', (Math.random() * 1.4) + 's');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    el.appendChild(p);
  }

  // Restart the slam animation even if the element was just shown
  el.classList.remove('active');
  void el.offsetWidth;
  el.classList.add('active');
  el.setAttribute('aria-hidden', 'false');
  videoLayer.classList.remove('quake');
  void videoLayer.offsetWidth;
  videoLayer.classList.add('quake');

  entranceTimer = setTimeout(function() { hideEntrance(); }, 5000);
}

function hideEntrance() {
  if (entranceTimer) { clearTimeout(entranceTimer); entranceTimer = null; }
  var el = document.getElementById('entrance');
  if (el) { el.classList.remove('active'); el.setAttribute('aria-hidden', 'true'); }
  videoLayer.classList.remove('quake');
}

function maybeShowFinale(ct, dur) {
  if (IS_MONITOR || finaleShown || playerState !== 'playing') return;
  if (!dur || dur < 60 || !ct) return;
  var remaining = dur - ct;
  if (remaining > 0.5 && remaining <= 13) {
    finaleShown = true;
    showFinale(currentSingerName);
  }
}

function showFinale(singer) {
  var el = document.getElementById('finale');
  if (!el) return;
  document.getElementById('fin-name').textContent = (singer || 'this singer') + '!';
  el.classList.add('active');
  el.setAttribute('aria-hidden', 'false');
  // Steady stream of claps/fire while the finale runs
  if (finaleSpawner) clearInterval(finaleSpawner);
  var finaleEmoji = ['\uD83D\uDC4F', '\uD83D\uDD25', '\uD83C\uDF89', '\uD83E\uDD18'];
  var bursts = 0;
  finaleSpawner = setInterval(function() {
    spawnReaction(finaleEmoji[bursts % finaleEmoji.length]);
    if (bursts % 2 === 0) spawnReaction(finaleEmoji[(bursts + 1) % finaleEmoji.length]);
    bursts++;
    if (bursts > 40) hideFinale();  // safety: never spin forever
  }, 400);
}

function hideFinale() {
  if (finaleSpawner) { clearInterval(finaleSpawner); finaleSpawner = null; }
  var el = document.getElementById('finale');
  if (el) { el.classList.remove('active'); el.setAttribute('aria-hidden', 'true'); }
}

// Synthesized FX sounds (no assets, offline). Modest volume so they sit
// on top of the karaoke mix without drowning it.
var fxAudioCtx = null;
function getFxAudioCtx() {
  if (!fxAudioCtx) {
    try { fxAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (fxAudioCtx.state === 'suspended') { try { fxAudioCtx.resume(); } catch (e) {} }
  return fxAudioCtx;
}

function playFxSound(kind) {
  if (IS_MONITOR) return;
  var ctx = getFxAudioCtx();
  if (!ctx) return;
  var now = ctx.currentTime;
  try {
    if (kind === 'airhorn') {
      // Classic meme airhorn rhythm: bee · be be be be · beeeow
      var master = ctx.createGain();
      master.gain.setValueAtTime(0.26, now);
      master.connect(ctx.destination);

      var shaper = ctx.createWaveShaper();
      var curve = new Float32Array(256);
      for (var ci = 0; ci < 256; ci++) {
        var x = (ci / 128) - 1;
        curve[ci] = Math.tanh(x * 3.4) * 0.95;
      }
      shaper.curve = curve;
      shaper.oversample = '2x';
      shaper.connect(master);

      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 820;
      bp.Q.value = 1.6;
      bp.connect(shaper);

      function toot(t0, dur, endRatio) {
        endRatio = endRatio || 1;
        [
          { freq: 392, type: 'square',   gain: 0.42 },
          { freq: 406, type: 'sawtooth', gain: 0.34 },
          { freq: 418, type: 'square',   gain: 0.28 },
          { freq: 784, type: 'sawtooth', gain: 0.12 },
        ].forEach(function(v) {
          var o = ctx.createOscillator();
          var g = ctx.createGain();
          o.type = v.type;
          o.frequency.setValueAtTime(v.freq, now + t0);
          if (endRatio !== 1) {
            o.frequency.exponentialRampToValueAtTime(Math.max(40, v.freq * endRatio), now + t0 + dur);
          }
          g.gain.setValueAtTime(0.0001, now + t0);
          g.gain.exponentialRampToValueAtTime(v.gain, now + t0 + 0.012);
          g.gain.setValueAtTime(v.gain * 0.85, now + t0 + Math.max(0.03, dur * 0.55));
          g.gain.exponentialRampToValueAtTime(0.0001, now + t0 + dur);
          o.connect(g);
          g.connect(bp);
          o.start(now + t0);
          o.stop(now + t0 + dur + 0.02);
        });
      }

      // bee
      toot(0.00, 0.18, 1);
      // be be be be
      toot(0.24, 0.09, 1);
      toot(0.38, 0.09, 1);
      toot(0.52, 0.09, 1);
      toot(0.66, 0.09, 1);
      // beeeow — long falling blast
      toot(0.82, 0.72, 0.55);
    } else if (kind === 'sendit') {
      // White-noise riser into a sub boom
      var dur = 1.1;
      var buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (i / data.length);
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(300, now);
      bp.frequency.exponentialRampToValueAtTime(6000, now + dur);
      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.12, now);
      src.connect(bp); bp.connect(ng); ng.connect(ctx.destination);
      src.start(now); src.stop(now + dur);

      var boom = ctx.createOscillator();
      var bg = ctx.createGain();
      boom.type = 'sine';
      boom.frequency.setValueAtTime(120, now + dur);
      boom.frequency.exponentialRampToValueAtTime(38, now + dur + 0.5);
      bg.gain.setValueAtTime(0.0001, now + dur);
      bg.gain.exponentialRampToValueAtTime(0.35, now + dur + 0.02);
      bg.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.7);
      boom.connect(bg); bg.connect(ctx.destination);
      boom.start(now + dur); boom.stop(now + dur + 0.8);
    }
  } catch (e) {
    console.log('[player] FX sound failed:', e && e.message);
  }
}

// ── Crowd reactions (phones → screen) ──

var RX_MAX_LIVE = 70;

function spawnReaction(emoji) {
  var layer = document.getElementById('reaction-layer');
  if (!layer) return;
  if (layer.childElementCount >= RX_MAX_LIVE) return;
  var span = document.createElement('span');
  span.className = 'rx';
  span.textContent = String(emoji || '\u2764\uFE0F').slice(0, 8);
  span.style.setProperty('--x', (4 + Math.random() * 92) + '%');
  span.style.setProperty('--sz', (34 + Math.random() * 44) + 'px');
  span.style.setProperty('--dur', (2.8 + Math.random() * 1.6) + 's');
  span.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
  layer.appendChild(span);
  span.addEventListener('animationend', function() { span.remove(); });
  // Fallback removal in case animationend never fires
  setTimeout(function() { if (span.parentNode) span.remove(); }, 5500);
}

// ── Lyrics ──

function LyricEngine(data) {
  this.lines = data.lines || [];
  this.currentLineIndex = -1;
  this.overlay = document.getElementById('lyric-overlay');
  this.lineEl = document.getElementById('lyric-line');
  this.countdownEl = document.getElementById('countdown');
}

LyricEngine.prototype.update = function(currentTime) {
  if (!this.lines.length) return;

  // Apply the global lyric offset (manual timing adjustment slider)
  var adjustedTime = currentTime - lyricOffset;

  // ── Find current line (with lookahead for gaps between lines) ──
  var LOOKAHEAD = 0.5; // seconds to pre-display a line before its first word
  var line = null;
  for (var i = 0; i < this.lines.length; i++) {
    var l = this.lines[i];
    // Compute when this line should first appear on screen.
    // If there's a gap from the previous line, show it early so the singer
    // can see the words before they're supposed to land.
    var displayStart = l.startTime - LOOKAHEAD;
    if (i > 0) {
      var prevEnd = this.lines[i - 1].endTime;
      var gap = l.startTime - prevEnd;
      if (gap < LOOKAHEAD) { displayStart = l.startTime; } // back-to-back: no pre-display
    }
    if (adjustedTime >= displayStart && adjustedTime <= l.endTime) { line = l; this.currentLineIndex = i; break; }
  }
  // Handle gaps between lines: if no exact match, find the nearest upcoming line
  if (!line && this.lines.length) {
    for (var j = 0; j < this.lines.length; j++) {
      if (this.lines[j].startTime > adjustedTime) {
        this.currentLineIndex = Math.max(0, j - 1);
        break;
      }
    }
    if (adjustedTime >= this.lines[this.lines.length - 1].endTime) {
      this.currentLineIndex = this.lines.length - 1;
    }
  }

  // ── Countdown during lead-in (use adjusted time) ──
  // Only show countdown if no line is active (including lookahead-displayed lines)
  var firstLine = this.lines[0];
  if (!line && firstLine && adjustedTime < firstLine.startTime) {
    var remaining = Math.ceil(firstLine.startTime - adjustedTime);
    if (remaining <= 3 && remaining > 0) {
      this.countdownEl.classList.add('active'); this.countdownEl.textContent = remaining;
    }
    if (remaining > 0) { this.overlay.classList.remove('active'); return; }
  }
  this.countdownEl.classList.remove('active');

  // ── Update main lyric overlay (bottom) ──
  if (!line) { this.overlay.classList.remove('active'); return; }

  var html = '';
  // Guard: if words array text doesn't match the line text, rebuild words from text.
  // This catches the case where line.text was corrected but words[] was left stale.
  var wordsMatch = line.words && line.words.length > 0;
  if (wordsMatch) {
    var concat = '';
    for (var w = 0; w < line.words.length; w++) concat += line.words[w].text;
    var textNoSpaces = (line.text || '').replace(/[\s,.\-']/g, '');
    var wordsNoSpaces = concat.replace(/[\s,.\-']/g, '');
    if (textNoSpaces.toLowerCase() !== wordsNoSpaces.toLowerCase()) wordsMatch = false;
  }
  if (wordsMatch) {
    for (var w = 0; w < line.words.length; w++) {
      var word = line.words[w];
      var cls = adjustedTime >= word.endTime ? 'done' : (adjustedTime >= word.startTime ? 'current' : '');
      html += '<span class="' + cls + '">' + escapeHtml(word.text) + '</span> ';
    }
  } else {
    html = escapeHtml(line.text || '');
  }
  this.lineEl.innerHTML = html;
  this.overlay.classList.add('active');
};

function hideLyrics() {
  document.getElementById('lyric-overlay').classList.remove('active');
  document.getElementById('countdown').classList.remove('active');
}

// ── Full lyrics sidebar ──

function renderFullLyrics(lines, title) {
  document.getElementById('full-lyrics-title').textContent = title || 'Full Lyrics';
  var body = document.getElementById('full-lyrics-body');
  var sidebar = document.getElementById('full-lyrics');

  // Filter out empty/whitespace-only lines and instrumental markers,
  // while preserving timing info for highlighting during playback.
  var timedLines = [];
  for (var i = 0; i < lines.length; i++) {
    var t = (lines[i].text || '').trim();
    if (t && !/^[\u266A\u266B\u2605\u2606\-\(\)\[\]\{\}\s]*$/.test(t)) {
      timedLines.push({ text: t, startTime: lines[i].startTime || 0, endTime: lines[i].endTime || 0 });
    }
  }

  if (timedLines.length === 0) {
    body.innerHTML = '<div style="color:rgba(255,255,255,0.3);text-align:center;padding:20px;font-size:18px">No lyrics available</div>';
    sidebar.classList.add('active');
    fullLyricsLines = null;
    return;
  }

  fullLyricsLines = timedLines;  // store for progress-timer highlighting

  // Fit all lines edge-to-edge, top-to-bottom in the sidebar — no scroll
  var fontSize = 80 / timedLines.length;
  fontSize = Math.max(0.8, Math.min(6, fontSize));

  var html = '';
  for (var j = 0; j < timedLines.length; j++) {
    html += '<div class="fl-line" style="font-size:' + fontSize.toFixed(2) + 'vh;line-height:1.15">' +
      escapeHtml(timedLines[j].text) + '</div>';
  }

  body.innerHTML = html;
  sidebar.classList.add('active');

  // Immediately highlight the current line (don't wait for next progress tick)
  if (currentVideoEl) {
    highlightFullLyrics(currentVideoEl.currentTime || 0);
  }
}

function hideFullLyrics() {
  document.getElementById('full-lyrics').classList.remove('active');
  document.getElementById('full-lyrics-body').innerHTML = '';
  fullLyricsLines = null;
}

// ── Full lyrics timed highlighting ──
function highlightFullLyrics(currentTime) {
  if (!fullLyricsLines || !fullLyricsLines.length) return;
  var el = document.getElementById('full-lyrics-body');
  if (!el) return;
  var lineEls = el.querySelectorAll('.fl-line');
  if (!lineEls.length) return;

  var adjustedTime = currentTime - lyricOffset;
  var activeIdx = -1;

  // Find the line whose time window contains adjustedTime
  for (var i = 0; i < fullLyricsLines.length; i++) {
    if (adjustedTime >= fullLyricsLines[i].startTime && adjustedTime <= fullLyricsLines[i].endTime) {
      activeIdx = i; break;
    }
  }
  // If no exact match, highlight the last line whose startTime has passed
  if (activeIdx < 0) {
    for (var j = fullLyricsLines.length - 1; j >= 0; j--) {
      if (fullLyricsLines[j].startTime <= adjustedTime) { activeIdx = j; break; }
    }
  }

  // Apply highlight class to the active line, remove from others
  for (var k = 0; k < lineEls.length; k++) {
    if (k === activeIdx) {
      lineEls[k].classList.add('highlight');
    } else {
      lineEls[k].classList.remove('highlight');
    }
  }
}

// ── Lyric timing slider ──

function showLyricSlider(initialOffset) {
  lyricOffset = initialOffset || 0;
  document.getElementById('lyric-slider-input').value = lyricOffset;
  document.getElementById('lyric-offset-display').textContent = lyricOffset.toFixed(1) + 's';
  document.getElementById('lyric-slider').classList.add('active');
}

function hideLyricSlider() {
  document.getElementById('lyric-slider').classList.remove('active');
}

function onSliderInput() {
  lyricOffset = parseFloat(document.getElementById('lyric-slider-input').value);
  document.getElementById('lyric-offset-display').textContent = lyricOffset.toFixed(1) + 's';
  // Real-time: the LyricEngine already uses lyricOffset in update()
}

function resetLyricOffset() {
  lyricOffset = 0;
  document.getElementById('lyric-slider-input').value = 0;
  document.getElementById('lyric-offset-display').textContent = '0.0s';
}

async function saveLyricOffset() {
  if (!currentVideoId) return;
  try {
    var vidForSave = isYouTube ? currentVideoId : currentVideoId + '-karaoke';
    var result = await api.lyrics.saveOffset(vidForSave, lyricOffset);
    if (result && result.ok) {
      document.getElementById('lyric-slider').classList.remove('active');
    }
  } catch (e) {
    console.error('[player] Failed to save lyric offset:', e);
  }
}

// ── Loading ──

function showLoading(text) {
  document.getElementById('loading-text').textContent = text || 'Loading...';
  document.getElementById('loading-overlay').classList.add('active');
  document.getElementById('loading-overlay').classList.remove('error');
}
function hideLoading() { document.getElementById('loading-overlay').classList.remove('active'); }
function showErrorOverlay(text) {
  document.getElementById('loading-text').textContent = text || 'Error';
  document.getElementById('loading-overlay').classList.add('active', 'error');
  // Auto-clear after 4s (queue should auto-advance by then)
  setTimeout(function() {
    document.getElementById('loading-overlay').classList.remove('active');
  }, 4000);
}

// ── Connection ──

function updateConnStatus(status) {
  var el = document.getElementById('conn-status');
  el.style.display = 'block';
  el.style.background = status === 'connected' ? 'rgba(16,185,129,0.8)' : 'rgba(220,38,38,0.8)';
  el.textContent = status === 'connected' ? 'Connected' : 'Disconnected';
}

// ── Marquee ──

function updateMarquee(title, requester) {
  document.getElementById('qm-singer').textContent = (requester && !/^dj$/i.test(String(requester).trim())) ? requester : 'Naynay';
  document.getElementById('qm-song').textContent = title || '\u2014';
  document.getElementById('queue-marquee').classList.remove('hidden');
  renderMarquee();
}

function renderMarquee() {
  var inner = document.getElementById('qm-ticker-inner');
  var marquee = document.getElementById('queue-marquee');
  if (queue.length === 0 && currentIndex < 0) { marquee.classList.add('hidden'); return; }
  marquee.classList.remove('hidden');
  var items = [];
  for (var i = 0; i < queue.length; i++) { if (i === currentIndex) continue; if (i > currentIndex) items.push(queue[i]); }
  for (var j = 0; j < queue.length; j++) { if (j >= currentIndex) break; items.push(queue[j]); }
  // Cap ticker length — a 600-item marquee DOM is a memory/CPU bomb
  if (items.length > 20) items = items.slice(0, 20);
  var html = '';
  for (var dup = 0; dup < 2; dup++) {
    for (var k = 0; k < items.length; k++) {
      var item = items[k];
      html += '<div class="qm-tick"><span class="qm-num">'+(k+1)+'</span><span class="qm-tick-singer">'+escapeHtml(item.requester||'\u2014')+'</span><span class="qm-tick-divider">\u2022</span><span class="qm-tick-song">'+escapeHtml(safeTitle(item.title, item.videoId)||'\u2014')+'</span></div>';
    }
    // Add Venmo/CashApp promo in the scroller after each full loop of queue
    html += '<div class="qm-tick"><span class="qm-tick-venmo">Venmo @karolpdx</span><span class="qm-tick-divider">\u2022</span><span class="qm-tick-venmo">CashApp $karolpdx</span></div>';
  }
  if (!items.length) html = '<div class="qm-tick"><span class="qm-tick-singer" style="color:var(--accent)">Queue is empty \u2014 add some songs</span></div>';
  inner.innerHTML = html;
  inner.style.animation = 'none'; inner.offsetHeight;
  // Slower scroll: 100s base, +10s per item
  inner.style.animation = 'marquee-scroll ' + Math.max(20, 100 + (items.length||1)*8) + 's linear infinite';
}

function escapeHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Keyboard shortcuts ──
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') { e.preventDefault(); api.transport.play(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); api.transport.skip(); }
  if (e.code === 'KeyF') { e.preventDefault(); document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});

console.log('[player] Ready.');
